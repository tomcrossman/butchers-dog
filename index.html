<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
/* ============================================================
   A BUTCHER'S WINDOW

   Not the squared paper of the other two. Bottle-green glazed tiles, a
   brass rail across the top with the string hanging off it, gold
   signwriting, and no ink outline anywhere: the meat is built from flat
   shapes with the light on one side of them, which is how a sausage is
   drawn and nothing like how a cartoon is.
   ============================================================ */
:root {
    --tile:    #1c4a39;
    --tile-lo: #17402f;
    --grout:   #12362a;
    --shade:   #143d2f;
    --cream:   #f3e9d6;
    --cream-d: #d9cbb0;
    --gold:    #dcab3e;
    --gold-d:  #a87c22;
    --brass:   #c59430;
    --brass-h: #f0d484;
    --meat:    #c4472e;
    --meat-hi: #dd6f4c;
    --meat-lo: #8c2b1b;
    --danger:  #d8462f;
    --good:    #74b985;
    --font:         "Lato", system-ui, -apple-system, sans-serif;
    --font-display: "Alfa Slab One", Georgia, serif;
}
* { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; font-family: var(--font); color: var(--cream); background: var(--tile); }

/* glazed tiles: a grid of grout, a wipe of light down the wall, and the
   corners falling away so it reads as a room rather than a pattern */
#app {
    position: fixed; inset: 0; overflow: hidden; touch-action: none;
    background:
        radial-gradient(130% 80% at 50% 26%, rgba(255,255,255,.10) 0%, transparent 62%),
        radial-gradient(120% 100% at 50% 50%, transparent 46%, rgba(0,0,0,.40) 100%),
        repeating-linear-gradient(0deg, var(--grout) 0 2.5px, transparent 2.5px 48px),
        repeating-linear-gradient(90deg, var(--grout) 0 2.5px, transparent 2.5px 60px),
        linear-gradient(180deg, #235c47 0%, var(--tile) 42%, #163d2f 100%);
}
#pad { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ============================================================
   SIGNWRITING
   Every panel is the same thing: a dark plate, a gold hairline a little
   way inside it, and gold letters. No wonky outlines, no drop shadow.
   ============================================================ */
.sign {
    position: relative;
    background: linear-gradient(180deg, #1a4636, #123327);
    border: 2px solid var(--gold-d); border-radius: 3px;
    box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
}
.sign::after {
    content: ''; position: absolute; inset: 3px; pointer-events: none;
    border: 1px solid rgba(220, 171, 62, .55); border-radius: 1px;
}
#hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: stretch; gap: 8px;
    padding: 11px 11px; pointer-events: none;
}
.plate {
    display: flex; align-items: center; gap: 7px; padding: 6px 11px 5px;
    font-family: var(--font-display); font-size: 17px; letter-spacing: .01em;
    color: var(--gold); text-shadow: 0 1px 0 rgba(0,0,0,.5);
}
.plate .ico { width: 14px; height: 14px; fill: var(--gold); flex: none; opacity: .9; }
.plate .of {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 8px; padding-left: 9px; border-left: 1px solid rgba(220,171,62,.4);
    font-size: .82em; opacity: .78;
}
#bestplate.beating { animation: beat .55s ease-in-out infinite alternate; }
#bestplate.beating .of { display: none; }
@keyframes beat { from { box-shadow: 0 2px 0 rgba(0,0,0,.35); }
                  to   { box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 16px rgba(220,171,62,.6); } }
#quota { flex: 1; min-width: 74px; display: flex; align-items: center; padding: 6px 9px; }
#quota .pips { display: flex; gap: 4px; flex: 1; }
#quota .pip {
    flex: 1; height: 11px; min-width: 4px; border-radius: 2px;
    border: 1.5px solid rgba(220,171,62,.5); background: transparent;
}
#quota .pip.need { background: rgba(220,171,62,.16); }
#quota .pip.got  { background: var(--meat); border-color: var(--meat-hi); }
#mute {
    pointer-events: auto; cursor: pointer; padding: 7px 8px 4px; line-height: 0;
    background: linear-gradient(180deg, #1a4636, #123327);
    border: 2px solid var(--gold-d); border-radius: 3px;
}
#mute:active { transform: translateY(1px); }
#mute .off { display: none; }
#mute.muted .on { display: none; }
#mute.muted .off { display: inline; }

#prompt {
    position: absolute; left: 0; right: 0; bottom: 6%; z-index: 2;
    text-align: center; pointer-events: none; padding: 0 22px;
    font-family: var(--font); font-weight: 900; text-transform: uppercase;
    font-size: clamp(12px, 3.4vw, 15px); letter-spacing: .18em;
    color: var(--cream); opacity: .5; transition: opacity .25s;
}
#prompt.gone { opacity: 0; }

#banner {
    position: absolute; left: 0; right: 0; top: 28%; z-index: 4;
    text-align: center; pointer-events: none; opacity: 0;
    font-family: var(--font-display); color: var(--gold);
    text-shadow: 0 3px 0 rgba(0,0,0,.45);
}
#banner .r { display: block; font-size: clamp(34px, 11vw, 54px); line-height: 1; letter-spacing: .01em; }
#banner.go { animation: bannerGo 1.2s ease-out both; }
@keyframes bannerGo {
    0%   { transform: scale(.82); opacity: 0; }
    18%  { transform: scale(1); opacity: 1; }
    70%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.06); opacity: 0; }
}

#tally {
    position: absolute; left: 0; right: 0; bottom: 13%; z-index: 9;
    text-align: center; pointer-events: none; display: none; padding: 0 18px;
}
#tally.on { display: block; animation: tallyIn .3s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes tallyIn { from { transform: translateY(14px) scale(.92); opacity: 0; }
                     to   { transform: none; opacity: 1; } }
#tally .n {
    display: block; font-family: var(--font-display); font-size: clamp(40px, 13vw, 58px);
    line-height: 1; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.45);
}
#tally .l { display: block; font-family: var(--font); font-weight: 900; font-size: 17px;
            text-transform: uppercase; letter-spacing: .1em; margin-top: 3px; }
#tally .b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em;
            text-transform: uppercase; opacity: .5; margin-top: 5px; }

/* ---- the front door ---------------------------------------------------
   A phone browser will not let a freshly loaded page make a sound on the
   first touch it receives, so the first press has to be spent on something
   that is not the game. Pressing Open is what opens the audio. */
#intro {
    position: absolute; inset: 0; z-index: 12;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 22px 9%; text-align: center;
    background: linear-gradient(transparent 26%, rgba(18,51,39,.85) 46%, #123327 62%);
    animation: introIn .5s ease-out both;
}
@keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
#intro[hidden] { display: none; }
body.waiting #hud { display: none; }
#intro h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400; color: var(--gold);
    font-size: clamp(38px, 13.5vw, 60px); line-height: .98; letter-spacing: .01em;
    text-shadow: 0 4px 0 rgba(0,0,0,.45);
}
#intro .rule {
    width: 132px; height: 2px; margin: 13px 0 12px;
    background: linear-gradient(90deg, transparent, var(--gold-d), transparent);
}
#intro p { margin: 0; max-width: 330px; font-size: 13px; font-weight: 700;
           line-height: 1.6; letter-spacing: .04em; opacity: .74; }
#intro .btn { margin-top: 22px; width: 100%; max-width: 236px; }

/* ============================================================
   THE TICKET
   ============================================================ */
#card {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 14px 18px 18px; pointer-events: none;
    background: linear-gradient(transparent 40%, rgba(8,22,17,.55) 76%, rgba(8,22,17,.82) 100%);
}
#card[hidden] { display: none; }
#card .inner {
    position: relative; flex: none; pointer-events: auto;
    animation: sheetIn .34s cubic-bezier(.2, 1.3, .4, 1) both;
    width: 100%; max-width: 316px; padding: 22px 20px 20px;
    background: linear-gradient(180deg, #faf4e6, #eadfc6);
    border: 3px solid #2a2118; border-radius: 4px;
    box-shadow: 0 10px 0 rgba(0,0,0,.30); text-align: center; color: #2a2118;
}
#card .inner::after {
    content: ''; position: absolute; inset: 6px; pointer-events: none;
    border: 1.5px solid rgba(42,33,24,.35);
}
@keyframes sheetIn { from { transform: translateY(26px); opacity: 0; }
                     to   { transform: translateY(0); opacity: 1; } }
#ribbon {
    position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 14px; letter-spacing: .16em; white-space: nowrap;
    padding: 5px 18px 4px; background: var(--danger); color: #fff5e6;
    border: 2.5px solid #2a2118; border-radius: 2px; z-index: 3;
    animation: ribbonIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes ribbonIn { from { transform: translateX(-50%) scale(.6); opacity: 0; }
                      to   { transform: translateX(-50%) scale(1); opacity: 1; } }
#card.record #ribbon { background: var(--gold); color: #2a2118; }
#card #score {
    display: block; font-family: var(--font-display); font-size: 56px; line-height: 1;
    color: #b03a25; margin: 10px 0 0;
}
#card.record #score { color: #a8791e; }
#score .pc { font-size: .28em; letter-spacing: .12em; text-transform: uppercase;
             opacity: .7; margin-left: 7px; }
#rating { margin: 6px 0 0; font-family: var(--font); font-weight: 900; font-size: 17px;
          text-transform: uppercase; letter-spacing: .06em; }
#pass { margin: 7px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .12em;
        text-transform: uppercase; opacity: .55; }
.btn {
    margin-top: 16px; width: 100%;
    font-family: var(--font-display); font-size: 19px; font-weight: 400; letter-spacing: .04em;
    padding: 13px; color: #2a2118;
    background: linear-gradient(180deg, #e8be55, var(--brass));
    border: 2.5px solid #2a2118; border-radius: 3px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
/* the dog, taking a view on your butchery, in an enamel roundel */
.cheer {
    position: absolute; left: -20px; top: -20px;
    width: 84px; height: 84px; border-radius: 50%; overflow: hidden;
    background: radial-gradient(circle at 42% 34%, #2a6650, #143d2f);
    border: 3px solid #2a2118; box-shadow: 0 4px 0 rgba(0,0,0,.3); z-index: 2;
    animation: cheerIn .6s cubic-bezier(.2, 1.7, .4, 1) both;
}
.cheer::after {
    content: ''; position: absolute; inset: 4px; border-radius: 50%; pointer-events: none;
    border: 1.5px solid rgba(220,171,62,.5);
}
.cheer canvas { width: 100%; height: 100%; display: block; }
@keyframes cheerIn { from { transform: scale(0) rotate(-16deg); } to { transform: scale(1) rotate(-4deg); } }

#app.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
    10%, 90% { transform: translate3d(-3px, 1px, 0); }
    20%, 80% { transform: translate3d(7px, -2px, 0); }
    30%, 50%, 70% { transform: translate3d(-11px, 2px, 0); }
    40%, 60% { transform: translate3d(11px, -1px, 0); }
}
#version { position: absolute; bottom: 7px; right: 10px; z-index: 3;
           font-size: 9px; font-weight: 700; letter-spacing: .14em;
           text-transform: uppercase; color: var(--cream); opacity: .22; }

@media (max-width: 400px) {
    #hud { padding: 9px 9px; gap: 6px; }
    .plate { font-size: 14px; padding: 5px 8px 4px; }
    .plate .ico { width: 12px; height: 12px; }
    #quota { padding: 5px 7px; }
    #mute { padding: 6px 7px 3px; }
    #mute svg { width: 18px; height: 18px; }
}
</style>
</head>

<body class="waiting">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-cup" viewBox="0 0 14 14">
        <path d="M 4 1.4 H 10 V 5.2 C 10 7.3, 8.7 8.6, 7 8.6 C 5.3 8.6, 4 7.3, 4 5.2 Z"/>
        <path d="M 6 8.4 H 8 V 10.4 H 6 Z"/><path d="M 3.4 10.4 H 10.6 V 12.6 H 3.4 Z"/>
        <path d="M 10.2 2.6 H 12.2 V 4.2 C 12.2 5.5, 11.2 6.2, 10.2 6.2" fill="none"
              stroke="currentColor" stroke-width="1.3"/>
        <path d="M 3.8 2.6 H 1.8 V 4.2 C 1.8 5.5, 2.8 6.2, 3.8 6.2" fill="none"
              stroke="currentColor" stroke-width="1.3"/>
    </symbol>
</svg>

<div id="app">
    <canvas id="pad"></canvas>

    <div id="hud">
        <div class="plate sign" id="bestplate">Round&nbsp;<span id="round-val">1</span><span
            class="of"><svg class="ico"><use href="#i-cup"/></svg><span id="best-val">0</span></span></div>
        <div id="quota" class="sign"><span class="pips" id="pips"></span></div>
        <button id="mute" aria-label="Sound on or off">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#dcab3e"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 4 9 H 8 L 13 5 V 19 L 8 15 H 4 Z" fill="#dcab3e"/>
                <g class="on"><path d="M 16.5 9.5 q 2 2.5 0 5"/><path d="M 19.5 7 q 3.6 5 0 10"/></g>
                <g class="off"><path d="M 17 9.5 L 22 14.5 M 22 9.5 L 17 14.5"/></g>
            </svg>
        </button>
    </div>

    <div id="banner"></div>
    <div id="tally"></div>
    <div id="prompt">Swipe through the twists</div>

    <div id="intro">
        <h1>Butcher's<br>Dog</h1>
        <div class="rule"></div>
        <p>Cut the sausages off the string before the dog gets to them</p>
        <button class="btn" id="play">Open Up</button>
    </div>

    <div id="card" hidden>
        <div class="inner">
            <div id="ribbon">GAME OVER</div>
            <div class="cheer"><canvas id="mug" width="88" height="88"></canvas></div>
            <span id="score">0<span class="pc">rounds</span></span>
            <p id="rating">Butchered</p>
            <p id="pass"></p>
            <button class="btn" id="again">Again!</button>
        </div>
    </div>

    <div id="version">v1</div>
</div>

<script>
const APP_VERSION = 'v2';
document.getElementById('version').textContent = `Butcher's Dog ${APP_VERSION}`;

/* ============================================================
   SOUND
   All of it synthesised - there is not a recording in the project. The
   unlock dance below is the one Perfect Circle paid for in full: a phone
   browser will not open an audio session on a page's first touch, so the
   Play button spends it, and everything is scheduled against a clock that
   has been seen to move rather than one that claims to be running.
   ============================================================ */
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, master = null, soundOn = true;
const soundKey = 'bd-sound';
try { soundOn = localStorage.getItem(soundKey) !== 'off'; } catch (e) { /* private mode */ }

function audioNow() {
    if (!audioCtx) {
        audioCtx = new AC();
        master = audioCtx.createGain();
        master.gain.value = .7;
        master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx.currentTime;
}
function tone(t0, { freq, to, dur = .18, type = 'triangle', vol = .2, at = 0 }) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + at;
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), s + dur);
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .012);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(g); g.connect(master);
    o.start(s); o.stop(s + dur + .02);
}
const LEAD = .025;
let clockGoing = false;
function whenRunning(fn) {
    try {
        audioNow();
        const go = () => { clockGoing = true; fn(audioCtx.currentTime + LEAD); };
        if (clockGoing || audioCtx.currentTime > 0) return go();
        audioCtx.resume().catch(() => {});
        let tries = 0;
        const waitForTheClock = () => {
            if (audioCtx.currentTime > 0) return go();
            if (tries === 30) startSession();
            if (++tries > 90) return;
            requestAnimationFrame(waitForTheClock);
        };
        waitForTheClock();
    } catch (e) { /* no audio here, never mind */ }
}
const safely = fn => { if (!soundOn) return; whenRunning(fn); };
let noiseBuf = null;
function noise() {
    if (!noiseBuf) {
        const len = Math.floor(audioCtx.sampleRate * .6);
        noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
}
function hiss(t0, { hp = 1200, lp = 16000, dur = .12, vol = .3, at = 0 }) {
    const n = audioCtx.createBufferSource(), h = audioCtx.createBiquadFilter(),
          l = audioCtx.createBiquadFilter(), g = audioCtx.createGain(), s = t0 + at;
    n.buffer = noise();
    h.type = 'highpass'; h.frequency.value = hp;
    l.type = 'lowpass';  l.frequency.value = lp;
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    n.connect(h); h.connect(l); l.connect(g); g.connect(master);
    n.start(s); n.stop(s + dur + .02);
}
/* A clean cut is a snick: a scrape of steel and a short bright ring, pitched
   up by how good it was, so a dead square cut through the middle of a twist
   sounds different from one that only just counted. */
const snick = q => safely(t => {
    const k = .5 + q / 100;
    hiss(t, { hp: 3400 * k, lp: 15000, dur: .05, vol: .3 });
    tone(t, { freq: 900 * k, to: 1800 * k, dur: .07, type: 'square', vol: .1, at: .005 });
    if (q > 75) tone(t, { freq: 2400 * k, dur: .16, type: 'triangle', vol: .07, at: .03 });
});
// a cut through the middle of a sausage, which is not a cut, it is a mess
const squelch = () => safely(t => {
    hiss(t, { hp: 180, lp: 900, dur: .17, vol: .34 });
    tone(t, { freq: 190, to: 70, dur: .2, type: 'sawtooth', vol: .16 });
});
// a sausage landing in the tray
const plop = n => safely(t => {
    tone(t, { freq: 330 + n * 26, dur: .1, type: 'triangle', vol: .16 });
    tone(t, { freq: 660 + n * 52, dur: .07, type: 'sine', vol: .08, at: .02 });
});
// the dog getting one
const chomp = () => safely(t => {
    hiss(t, { hp: 300, lp: 2600, dur: .09, vol: .34 });
    tone(t, { freq: 150, to: 58, dur: .16, type: 'square', vol: .2, at: .01 });
    tone(t, { freq: 320, to: 120, dur: .2, type: 'sawtooth', vol: .12, at: .06 });
});
const woof = () => safely(t => {
    tone(t, { freq: 420, to: 150, dur: .13, type: 'sawtooth', vol: .2 });
    tone(t, { freq: 210, to: 84, dur: .18, type: 'square', vol: .14, at: .02 });
    hiss(t, { hp: 400, lp: 3000, dur: .1, vol: .14 });
});
const jingleWin = () => safely(t => {
    const M = [[0, 392, .16], [.16, 523, .16], [.32, 659, .16], [.48, 784, .30],
               [.80, 880, .16], [.96, 784, .16], [1.12, 659, .16], [1.28, 698, .16],
               [1.44, 880, .16], [1.60, 784, .16], [1.76, 659, .16], [1.92, 1046, .80]];
    M.forEach(([at, freq, dur]) => tone(t, { freq, dur, type: 'triangle', vol: .17, at }));
    M.forEach(([at, freq, dur]) => tone(t, { freq: freq / 2, dur, type: 'sine', vol: .07, at }));
    [[0, 131], [.48, 196], [.96, 175], [1.44, 196]].forEach(([at, freq]) =>
        tone(t, { freq, dur: .46, type: 'sine', vol: .12, at }));
    [262, 330, 392, 523].forEach(freq => tone(t, { freq, dur: 1, type: 'triangle', vol: .08, at: 1.92 }));
    tone(t, { freq: 131, dur: 1.05, type: 'sine', vol: .13, at: 1.92 });
    hiss(t, { hp: 6000, dur: .5, vol: .1, at: 1.94 });
});
const jingleLose = () => safely(t => {
    const M = [[0, 330, 311, .30], [.34, 294, 277, .30], [.68, 262, 247, .30],
               [1.02, 247, 233, .34], [1.40, 220, 196, .50]];
    M.forEach(([at, freq, to, dur]) => {
        tone(t, { freq, to, dur, type: 'sawtooth', vol: .13, at });
        tone(t, { freq: freq * 1.007, to: to * 1.007, dur, type: 'sawtooth', vol: .06, at });
    });
    [[0, 110], [.68, 98], [1.40, 110]].forEach(([at, freq]) =>
        tone(t, { freq, dur: .62, type: 'triangle', vol: .11, at }));

    ctx.fill();
    ctx.restore();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = piece.from; i <= piece.to; i++) {
        const s0 = i === 0 ? 0 : string.twists[i - 1];
        const s1 = i === string.n - 1 ? string.len : string.twists[i];
        const from = Math.max(a, s0) + 13, to = Math.min(b, s1) - 13;
        if (to - from < 10) continue;
        for (const [off, col, wid] of [[.52, '#8c2b1b', .34], [-.50, '#dd6f4c', .30],
                                       [-.56, '#ea8f6e', .13]]) {
            ctx.beginPath();
            for (let t = from; t <= to; t += 3) {
                const [x, y, tx, ty] = at(t), w = widthAt(t, piece);
                const px = x - ty * w * off, py = y + tx * w * off;
                t === from ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.strokeStyle = col;
            ctx.lineWidth = Math.max(2, FAT * wid * 2);
            ctx.stroke();
        }
    }
    // the turns of skin at each neck, which is what says twist rather than dent
    for (let i = piece.from; i < piece.to; i++) {
        const c = string.twists[i];
        for (const o of [-3.2, 0, 3.2]) {
            const [x, y, tx, ty] = at(c + o), w = widthAt(c + o, piece) * 1.15;
            ctx.beginPath();
            ctx.moveTo(x - ty * w - tx * 1.5, y + tx * w - ty * 1.5);
            ctx.lineTo(x + ty * w + tx * 1.5, y - tx * w + ty * 1.5);
            ctx.strokeStyle = 'rgba(80,22,12,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
        }
    }
    ctx.globalAlpha = 1;
}
/* The rail, and the hook the string is on. Brass, so a bar of dark, a bar of
   light and a bright line where the top of it catches the room. */
function drawRail() {
    const g = ctx.createLinearGradient(0, RAIL - 9, 0, RAIL + 9);
    g.addColorStop(0, '#8a6417'); g.addColorStop(.30, '#f0d484');
    g.addColorStop(.55, '#c59430'); g.addColorStop(1, '#6d4d12');
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(-6, RAIL - 9, W + 12, 18, 9); ctx.fill();
    ctx.restore();
    // the brackets holding it up
    for (const x of [30, W - 30]) {
        ctx.fillStyle = '#8a6417';
        ctx.beginPath(); ctx.roundRect(x - 7, RAIL - 26, 14, 20, 4); ctx.fill();
        ctx.fillStyle = 'rgba(240,212,132,.55)';
        ctx.beginPath(); ctx.roundRect(x - 4, RAIL - 24, 4, 16, 2); ctx.fill();
    }
}
function drawHook(x, yTop, k = 1) {
    ctx.save();
    ctx.strokeStyle = '#c59430'; ctx.lineWidth = 4.5 * k; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(x, RAIL + 5 * k, 7 * k, Math.PI, Math.PI * 2.05);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 7 * k, RAIL + 5 * k); ctx.lineTo(x + 7 * k, yTop);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(240,212,132,.5)'; ctx.lineWidth = 1.6 * k;
    ctx.beginPath();
    ctx.moveTo(x + 5.6 * k, RAIL + 5 * k); ctx.lineTo(x + 5.6 * k, yTop);
    ctx.stroke();
    ctx.restore();
}
/* The dog, on the same terms: no outline, just shapes with the light on one
   side. Everything wide and low, the skull small against the jaw, jowls that
   hang past the mouth, ears folded over rather than up, and a collar carrying
   more studs than the job calls for. */
function drawDog(ctx, x, y, k, open, ms) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(k, k);
    ctx.rotate(Math.sin(ms / 170) * .045);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const blob = (fill, path) => { ctx.beginPath(); path(); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 7;
    // the collar first, so the jowls hang over it
    blob('#2b2333', () => {
        ctx.moveTo(-52, 30); ctx.quadraticCurveTo(0, 48, 52, 30);
        ctx.lineTo(52, 49); ctx.quadraticCurveTo(0, 67, -52, 49);
    });
    ctx.restore();
    for (let i = -2; i <= 2; i++) {
        const px = i * 20, py = 47 + (2 - Math.abs(i)) * 3.4;
        blob('#dcab3e', () => { ctx.moveTo(px - 6, py + 4); ctx.lineTo(px, py - 8); ctx.lineTo(px + 6, py + 4); });
        blob('rgba(255,244,205,.55)', () => { ctx.moveTo(px - 2.4, py + 2); ctx.lineTo(px, py - 7); ctx.lineTo(px + 1.4, py + 1); });
    }
    // ears, folded over and set wide
    for (const sx of [-1, 1]) {
        blob('#b9a98c', () => {
            ctx.moveTo(sx * 34, -30);
            ctx.quadraticCurveTo(sx * 58, -34, sx * 56, -10);
            ctx.quadraticCurveTo(sx * 52, 8, sx * 36, 0);
        });
    }
    // the head: a small skull on a very wide jaw
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    blob('#efe3ca', () => {
        ctx.moveTo(-38, -16);
        ctx.quadraticCurveTo(-36, -40, 0, -40);
        ctx.quadraticCurveTo(36, -40, 38, -16);
        ctx.quadraticCurveTo(60, -4, 56, 20);
        ctx.quadraticCurveTo(50, 44, 0, 45);
        ctx.quadraticCurveTo(-50, 44, -56, 20);
        ctx.quadraticCurveTo(-60, -4, -38, -16);
    });
    ctx.restore();
    // the light down the left of the face, and the jowls in shade
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-38, -16);
    ctx.quadraticCurveTo(-36, -40, 0, -40);
    ctx.quadraticCurveTo(36, -40, 38, -16);
    ctx.quadraticCurveTo(60, -4, 56, 20);
    ctx.quadraticCurveTo(50, 44, 0, 45);
    ctx.quadraticCurveTo(-50, 44, -56, 20);
    ctx.quadraticCurveTo(-60, -4, -38, -16);
    ctx.closePath();
    ctx.clip();
    blob('#fdf7e8', () => { ctx.moveTo(-64, -46); ctx.lineTo(-6, -46); ctx.lineTo(-30, 50); ctx.lineTo(-64, 50); });
    blob('#d5c6a6', () => { ctx.moveTo(-64, 22); ctx.quadraticCurveTo(0, 36, 64, 22); ctx.lineTo(64, 52); ctx.lineTo(-64, 52); });
    ctx.restore();
    // the brow, which is where a bulldog keeps its opinion
    for (const sx of [-1, 1]) {
        blob('#3a2f22', () => {
            ctx.moveTo(sx * 6, -25); ctx.quadraticCurveTo(sx * 22, -33, sx * 34, -19);
            ctx.quadraticCurveTo(sx * 22, -27, sx * 7, -21);
        });
        blob('rgba(180,164,132,.7)', () => {
            ctx.moveTo(sx * 10, -34); ctx.quadraticCurveTo(sx * 21, -39, sx * 29, -32);
            ctx.quadraticCurveTo(sx * 21, -36, sx * 10, -32);
        });
    }
    blob('rgba(180,164,132,.7)', () => { ctx.moveTo(-1.4, -31); ctx.lineTo(1.4, -31); ctx.lineTo(1.4, -19); ctx.lineTo(-1.4, -19); });
    // eyes, wide apart and low
    for (const sx of [-1, 1]) {
        blob('#2a201a', () => ctx.arc(sx * 21, -13, 5.4, 0, Math.PI * 2));
        blob('#fdf7e8', () => ctx.arc(sx * 21 - 1.9, -15.2, 1.8, 0, Math.PI * 2));
    }
    // the muzzle: wide, flat and pushed in
    blob('#fdf7e8', () => ctx.ellipse(0, 12, 31, 20, 0, 0, Math.PI * 2));
    blob('rgba(213,198,166,.55)', () => ctx.ellipse(0, 20, 27, 12, 0, 0, Math.PI * 2));
    blob('#2a201a', () => {
        ctx.moveTo(-13, 0); ctx.quadraticCurveTo(0, -9, 13, 0); ctx.quadraticCurveTo(0, 11, -13, 0);
    });
    blob('rgba(255,255,255,.3)', () => ctx.ellipse(-5, -3, 4, 2, -.3, 0, Math.PI * 2));

    if (open) {
        blob('#4d1c27', () => ctx.ellipse(0, 24, 22, 17, 0, 0, Math.PI * 2));
        for (const sx of [-1, 1])
            blob('#fdf7e8', () => { ctx.moveTo(sx * 13, 11); ctx.lineTo(sx * 9, 21); ctx.lineTo(sx * 17, 21); });
        blob('#d4667c', () => ctx.ellipse(0, 31, 12, 9, 0, 0, Math.PI * 2));
    } else {
        blob('#3a2f22', () => {
            ctx.moveTo(-18, 13); ctx.quadraticCurveTo(-9, 23, 0, 15);
            ctx.quadraticCurveTo(9, 23, 18, 13);
            ctx.quadraticCurveTo(9, 20, 0, 12);
            ctx.quadraticCurveTo(-9, 20, -18, 13);
        });
        for (const sx of [-1, 1])
            blob('#fdf7e8', () => { ctx.moveTo(sx * 13, 21); ctx.lineTo(sx * 10, 12); ctx.lineTo(sx * 17, 12); });
        blob('#d4667c', () => {
            ctx.moveTo(4, 21); ctx.quadraticCurveTo(20, 25, 18, 40);
            ctx.quadraticCurveTo(15, 50, 6, 46); ctx.quadraticCurveTo(0, 40, 4, 21);
        });
        blob('rgba(255,255,255,.22)', () => {
            ctx.moveTo(8, 26); ctx.quadraticCurveTo(16, 30, 14, 40);
            ctx.quadraticCurveTo(11, 34, 8, 26);
        });
    }
    ctx.restore();
}
// the same head in the badge on the card, licking its lips if it did well
function drawMug(short) {
    const g = document.getElementById('mug').getContext('2d');
    g.clearRect(0, 0, 88, 88);
    drawDog(g, 44, 38, .62, short, 0);
}

function drawLoose(ms) {
    for (const l of loose) {
        const e = Math.min(1, (ms - l.t0) / 560);
        const ease = 1 - Math.pow(1 - e, 3);
        const x = l.x + (l.tx - l.x) * ease;
        const y = l.y + (l.ty - l.y) * ease;
        if (e > .55) drawHook(x - 7, y - 16, .62);      // the hook it ends up on
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((1 - ease) * 2.2 + Math.sin((ms - l.t0) / 260) * .05 * ease);
        ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.ellipse(0, 0, 15.5, 29, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#c4472e'; ctx.fill();
        ctx.shadowColor = 'transparent';
        // the shade is a crescent taken off the lit side rather than a second
        // blob dropped on top, which came out looking like a hole in it
        ctx.save();
        ctx.clip();
        ctx.beginPath();
        ctx.ellipse(11, 3, 9, 30, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#8c2b1b'; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-5.5, -3, 4.2, 18, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#dd6f4c'; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-6, -6, 1.8, 11, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#ea8f6e'; ctx.fill();
        ctx.restore();
        ctx.restore();
    }
}

function draw() {
    const ms = now();
    ctx.clearRect(0, 0, W, H);
    if (!string) return;

    drawRail();
    // the string is on the rail until its top sausage is cut off or eaten
    const head = pieces.find(p => p.from === 0);
    if (head) drawHook(at(0)[0] - 7, at(0)[1]);

    for (const p of pieces) drawPiece(p);
    drawLoose(ms);

    // where you cut, flashing white for a moment
    for (let i = cutFx.length - 1; i >= 0; i--) {
        const f = cutFx[i], e = (ms - f.t0) / 340;
        if (e >= 1) { cutFx.splice(i, 1); continue; }
        const [x, y, tx, ty] = at(string.twists[f.k]);
        ctx.save();
        ctx.globalAlpha = 1 - e;
        ctx.strokeStyle = '#ffeab0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        const L = 26 + e * 26;
        ctx.beginPath();
        ctx.moveTo(x - ty * L, y + tx * L); ctx.lineTo(x + ty * L, y - tx * L);
        ctx.stroke();
        ctx.restore();
    }
    // and where you should not have
    for (let i = mess.length - 1; i >= 0; i--) {
        const m = mess[i], e = (ms - m.t0) / 700;
        if (e >= 1) { mess.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = (1 - e) * .8;
        ctx.fillStyle = '#8c2b1b';
        for (let j = 0; j < 6; j++) {
            const a = j / 6 * Math.PI * 2 + m.t0;
            ctx.beginPath();
            ctx.arc(m.x + Math.cos(a) * e * 30, m.y + Math.sin(a) * e * 30 + e * e * 40,
                    4 * (1 - e), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // the blade you just drew, and the one you are drawing
    const line = swipe || (blade && (ms - blade.t0 < 220) ? blade.pts : null);
    if (line && line.length > 1) {
        ctx.save();
        ctx.globalAlpha = swipe ? .9 : 1 - (ms - blade.t0) / 220;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        line.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
        ctx.strokeStyle = 'rgba(255,234,176,.28)'; ctx.lineWidth = 7; ctx.stroke();
        ctx.strokeStyle = '#fff6dd'; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.restore();
    }

    // what that swipe was worth, said out loud
    for (let i = shouts.length - 1; i >= 0; i--) {
        const sh = shouts[i], e = (now() - sh.t0) / 980;
        if (e >= 1) { shouts.splice(i, 1); continue; }
        const rise = 1 - Math.pow(1 - Math.min(1, e * 2.2), 3);
        const pop = e < .16 ? .6 + .4 * (e / .16) * (2 - e / .16) : 1;
        ctx.save();
        ctx.globalAlpha = e > .6 ? 1 - (e - .6) / .4 : 1;
        ctx.translate(clamp(sh.x, 76, W - 76), sh.y - 34 * rise);
        ctx.scale(pop, pop);
        ctx.font = '700 27px "Alfa Slab One", Georgia, serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(12,32,24,.92)'; ctx.lineWidth = 7;
        ctx.strokeText(sh.text, 0, 0);
        ctx.fillStyle = sh.bad ? '#d8462f' : '#f0d484';
        ctx.fillText(sh.text, 0, 0);
        ctx.restore();
    }

    if (dog.going || dog.s <= string.len + 80) {
        const s = clamp(dog.s, 0, string.len);
        const [x, y] = at(s);
        const below = dog.s > string.len;
        drawDog(ctx, x, below ? at(string.len)[1] + (dog.s - string.len) : y, 1.02,
                dog.chomp > 0, ms);
    }
}
function tick() {
    cancelAnimationFrame(raf);
    const step = () => {
        const ms = now();
        const dt = Math.min(.05, (ms - (lastMs || ms)) / 1000);
        lastMs = ms;
        dogStep(dt);
        draw();
        if (live || loose.length || cutFx.length || mess.length || shouts.length) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
}
function jolt() {
    const app = document.getElementById('app');
    app.classList.remove('shake');
    void app.offsetWidth;
    app.classList.add('shake');
}

document.getElementById('again').addEventListener('click', e => {
    e.stopPropagation();
    card.hidden = true; card.className = '';
    startRound(1);
});
document.getElementById('play').addEventListener('click', e => {
    e.stopPropagation();
    startSession(); audioNow();
    showingIntro = false;
    document.getElementById('intro').hidden = true;
    document.body.classList.remove('waiting');
    startRound(1);
});

fit();
makeString(1);
dog.s = string.len + 64;          // waiting at the bottom of the title page
draw();
</script>
</body>
</html>
