        const m = mess[i], e = (ms - m.t0) / 700;
        if (e >= 1) { mess.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = (1 - e) * .8;
        ctx.fillStyle = '#8c2b1b';
        for (let j = 0; j < 6; j++) {
            const a = j / 6 * Math.PI * 2 + m.t0;
            ctx.beginPath();
            ctx.arc(m.x + Math.cos(a) * e * 30, m.y + Math.sin(a) * e * 30 + e * e * 40,
                    4 * (1 - e), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // the blade you just drew, and the one you are drawing
    const line = swipe || (blade && (ms - blade.t0 < 220) ? blade.pts : null);
    if (line && line.length > 1) {
        ctx.save();
        ctx.globalAlpha = swipe ? .9 : 1 - (ms - blade.t0) / 220;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        line.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
        ctx.strokeStyle = 'rgba(255,234,176,.28)'; ctx.lineWidth = 7; ctx.stroke();
        ctx.strokeStyle = '#fff6dd'; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.restore();
    }

    // the one it has got, on its way in: it leaves the string as the jaw opens
    // and is gone by the time the jaw shuts, which is the whole point of the
    // gape happening first
    if (chewing) {
        const e = (ms - chewing.t0) / (CHOMP * 1000);
        if (e >= .34) chewing = null;
        else if (e > .05) {
            const f = clamp((e - .05) / .29, 0, 1), ease = f * f;
            const [dx, dy] = dogAt();
            const x = chewing.x + (dx - chewing.x) * ease;
            const y = chewing.y + (dy + 14 - chewing.y) * ease;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(chewing.ang + f * 1.1);
            ctx.scale(1 - f * .55, 1 - f * .35);

                ctx.beginPath();
                ctx.ellipse(0, 0, chewing.len, FAT * .92, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#c4472e'; ctx.fill();
                ctx.save(); ctx.clip();
                ctx.beginPath();
                ctx.ellipse(0, FAT * .6, chewing.len, FAT * .7, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#8c2b1b'; ctx.fill();
                ctx.beginPath();
                ctx.ellipse(-chewing.len * .12, -FAT * .34, chewing.len * .6, FAT * .18, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#dd6f4c'; ctx.fill();
                ctx.restore();
            }
            ctx.restore();
        }
    }

    drawSteak(ctx);

    if (demoOn()) drawDemo(ms);

    // what that swipe was worth, said out loud
    for (let i = shouts.length - 1; i >= 0; i--) {
        const sh = shouts[i], e = (now() - sh.t0) / 980;
        if (e >= 1) { shouts.splice(i, 1); continue; }
        const rise = 1 - Math.pow(1 - Math.min(1, e * 2.2), 3);
        const pop = e < .16 ? .6 + .4 * (e / .16) * (2 - e / .16) : 1;
        ctx.save();
        ctx.globalAlpha = e > .6 ? 1 - (e - .6) / .4 : 1;
        ctx.translate(clamp(sh.x, 76, W - 76), sh.y - 34 * rise);
        ctx.scale(pop, pop);
        ctx.font = (sh.small ? '700 19px' : sh.gold ? '700 26px' : '700 27px') +
                   ' "Alfa Slab One", Georgia, serif';
        if (sh.gold) {
            ctx.save();                                   // a flash of it going off
            ctx.globalAlpha *= Math.max(0, 1 - e * 3);
            ctx.strokeStyle = '#fff6dd'; ctx.lineWidth = 3; ctx.lineCap = 'round';
            for (let r = 0; r < 8; r++) {
                const a2 = r / 8 * Math.PI * 2 + e * 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a2) * (26 + e * 60), Math.sin(a2) * (18 + e * 40));
                ctx.lineTo(Math.cos(a2) * (40 + e * 80), Math.sin(a2) * (28 + e * 54));
                ctx.stroke();
            }
            ctx.restore();
        }
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(12,32,24,.92)'; ctx.lineWidth = sh.small ? 5 : 7;
        ctx.strokeText(sh.text, 0, 0);
        ctx.fillStyle = sh.bad ? '#d8462f' : sh.small ? '#bdf0cc'

        ctx.fillText(sh.text, 0, 0);

        if (e >= 1) ghost = null;
        else {
            const rise = e < .16 ? 0 : Math.pow((e - .16) / .84, 1.4);
            const gy = ghost.y - rise * (ghost.y + 120);
            ctx.save();
            ctx.globalAlpha = Math.max(0, 1 - Math.pow(e, 2.4));
            ctx.translate(ghost.x, gy);
            ctx.rotate(Math.sin(e * 7) * .18);
            const sq = e < .16 ? 1 + Math.sin(e / .16 * Math.PI) * .16 : 1;
            ctx.scale(sq * (1 - rise * .35), (2 - sq) * (1 - rise * .35));
            // a halo, and the pair of wings that go with it
            if (e > .14) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, (e - .14) * 6);
                ctx.strokeStyle = '#f0d484'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.ellipse(0, -74, 26, 8, 0, 0, Math.PI * 2); ctx.stroke();
                const flap = Math.sin(ms / 90) * .3;
                for (const sx of [-1, 1]) {
                    ctx.save();
                    ctx.translate(sx * 48, -6);
                    ctx.rotate(sx * (.5 + flap));
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(sx * 30, -30, sx * 54, -8);
                    ctx.quadraticCurveTo(sx * 34, 4, 0, 14);
                    ctx.closePath();
                    ctx.fillStyle = '#fdf7e8'; ctx.fill();
                    ctx.restore();
                }
                ctx.restore();
            }
            drawDog(ctx, 0, 0, 1.02, { open: 0, mood: 'gone' }, 0, cast.dog);
            ctx.restore();
            // the stroke that did it, flashing white for a moment
            if (e < .22) {
                ctx.save();
                ctx.globalAlpha = 1 - e / .22;
                ctx.strokeStyle = '#fff6dd'; ctx.lineWidth = 5; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(ghost.x - 90, ghost.y - 18); ctx.lineTo(ghost.x + 90, ghost.y + 18);
                ctx.stroke();
                ctx.restore();
            }
        }
    } else if (dog.going || dog.s <= string.len + 80) {
        const [x, y] = dogAt();
        const pose = dog.chomp > 0 ? chompPose(1 - dog.chomp / CHOMP)
                                   : { open: 0, reach: 0, tilt: 0, squash: 0 };
        drawDog(ctx, x, y, 1.02, pose, ms, breedFor());
    }

    }

    if (!showingIntro) drawKnife(ctx, knife.x, knife.y, knife.ang, .86 + knife.at * .16, cast.knife);
}
function tick() {
    cancelAnimationFrame(raf);
    const step = () => {
        const ms = now();
        const dt = Math.min(.05, (ms - (lastMs || ms)) / 1000);
        lastMs = ms;
        dogStep(dt);
        steakStep(dt);
        knifeStep(dt);
        draw();
        const resting = Math.abs(knife.x - restPose()[0]) < 1.5 && knife.at < .02;
        if (live || loose.length || cutFx.length || mess.length || shouts.length
            || chewing || steak || ghost || demoOn() || !resting) raf = requestAnimationFrame(step);

}
function jolt() {
    const app = document.getElementById('app');
    app.classList.remove('shake');
    void app.offsetWidth;
    app.classList.add('shake');
}

/* A new week: a new man behind the counter, a new knife on the block and six
   new dogs to get past. */
/* A new week is dealt on the shopfront rather than behind your back: the
   till is emptied, a new man is behind the counter with a new knife, and a
   new dog is at the door. You get to see who all three are before you open
   up, which is the only reason to have a shopfront at all. */
const setupEl = document.getElementById('setup');
const storeEl = document.getElementById('store');
const bankLine = document.getElementById('bank-line');

/* The shop shows it on before it takes the money. Tapping something you do
   not own does not buy it - it puts it on the dog in the window, and the row
   turns into the price with Buy on it. Tapping again is the purchase. */
let tryOn = null;
function previewKit() {
    const kit = { ...cast.kit };
    if (tryOn && tryOn.kind !== 'knife') kit[tryOn.kind] = tryOn.id;
    return kit;
}
const previewKnife = () => (tryOn && tryOn.kind === 'knife') ? itemById(tryOn.id) : cast.knife;
function drawPreview(id, w, h, withMan) {
    const c = document.getElementById(id);
    if (!c) return;
    const g = c.getContext('2d');
    g.clearRect(0, 0, w, h);
    if (withMan) {
        drawButcher(g, true, { cx: w * .33, cy: h * .84, k: .54, holds: 'knife' });
        drawDog(g, w * .77, h * .80, .58 / cast.dog.k, { open: 0 }, 0, cast.dog, cast.kit);
    } else {
        drawDog(g, w / 2, h * .62, .74 / cast.dog.k, { open: 0 }, 0, cast.dog, previewKit());
        g.save();                                       // and whatever is on the block
        g.translate(w / 2 + 44, h - 22);
        g.rotate(-.34);
        drawKnife(g, 0, 0, 0, .52, previewKnife());
        g.restore();
    }
}
function showBank() {
    const t = `In the till: <b>${money2(save.bank)}</b>`;
    bankLine.innerHTML = t;
    document.getElementById('store-bank').innerHTML = t;
}

/* ---- picking your lot --------------------------------------------------- */
const breedList = () => TIERS.flat();
const breedIndex = () => save.tier * 2 + save.breed;
function setBreed(i) {
    const n = breedList().length;
    i = ((i % n) + n) % n;
    save.tier = i >> 1; save.breed = i & 1;
}
function paintSetup() {
    deal();
    document.getElementById('pick-butcher').textContent = BUTCHERS[save.butcher].name;
    document.getElementById('pick-dog').textContent = breedList()[breedIndex()].name;
    drawPreview('preview', 330, 250, true);
}
function openSetup() {
    document.getElementById('in-dog').value = save.dogName;
    document.getElementById('in-shop').value = save.shop;
    paintSetup();
    setupEl.hidden = false;
}
document.querySelectorAll('.nudge[data-pick]').forEach(btn => btn.addEventListener('click', () => {
    const step = +btn.dataset.step;
    if (btn.dataset.pick === 'butcher')
        save.butcher = (save.butcher + step + BUTCHERS.length) % BUTCHERS.length;
    else setBreed(breedIndex() + step);
    paintSetup();
    plop(2);
}));
document.getElementById('roll-dog').addEventListener('click', () => {
    document.getElementById('in-dog').value = pick(DOG_NAMES); plop(3);
});
document.getElementById('roll-shop').addEventListener('click', () => {
    document.getElementById('in-shop').value = pick(SHOPS); plop(4);
});
document.getElementById('setup-done').addEventListener('click', () => {
    startSession(); audioNow();
    save.dogName = (document.getElementById('in-dog').value || '').trim().slice(0, 12) || pick(DOG_NAMES);
    save.shop = (document.getElementById('in-shop').value || '').trim().slice(0, 26) || pick(SHOPS);
    started = true;
    putSave();
    setupEl.hidden = true;
    showShop();
});

/* ---- spending it -------------------------------------------------------- */
/* Everything but the one thing being shown is stripped back to nothing, so a
   tile is the item and not the item plus whatever the dog happens to have on
   at the time. The knives have no head to sit on and are drawn on their own. */
const BARE = { hat: 'bare', face: 'plain', collar: 'spiked' };
const TILE_W = 104, TILE_H = 92;
function drawTile(c, item) {
    const g = c.getContext('2d');
    g.clearRect(0, 0, TILE_W, TILE_H);
    if (item.kind === 'knife') {
        g.save();
        g.translate(TILE_W / 2, TILE_H / 2);
        g.rotate(-.5);
        drawKnife(g, 0, 0, 0, .58, item);
        g.restore();
        return;
    }
    const B = cast.dog;
    drawDog(g, TILE_W / 2, TILE_H * .60, .46 / B.k, { open: 0 }, 0, B,
            { ...BARE, [item.kind]: item.id });
}
function paintStore() {
    deal();
    showBank();
    drawPreview('stock-dog', 230, 210, false);
    document.getElementById('stock').innerHTML = KINDS.map(({ kind, label }) => {
        const tiles = STOCK.filter(i => i.kind === kind).map(i => {
            const got = owns(i.id), on = save.worn[kind] === i.id;
            const trying = tryOn && tryOn.id === i.id;
            const canAfford = save.bank >= i.price;
            const cls = on ? 'buy worn' : trying ? 'buy trying'
                      : got || canAfford ? 'buy' : 'buy poor';
            const tag = on ? `<span class="tag">Worn</span>`
                      : got ? `<span class="tag">Wear</span>`
                      : trying ? (canAfford ? `<span class="tag">Buy &middot; ${money0(i.price)}</span>`
                                            : `<span class="tag">Short</span>`)
                      : `<span class="pr">${money0(i.price)}</span>`;
            return `<button class="${cls}" data-item="${i.id}" title="${i.name}">` +
                   `<canvas width="${TILE_W}" height="${TILE_H}"></canvas>${tag}</button>`;
        }).join('');
        return `<div class="shelf"><h3>${label}</h3><div class="tiles">${tiles}</div></div>`;
    }).join('');
    document.querySelectorAll('#stock .buy').forEach(btn =>
        drawTile(btn.querySelector('canvas'), itemById(btn.dataset.item)));
}
const till = () => safely(t => {
    tone(t, { freq: 1200, dur: .08, type: 'square', vol: .13 });
    tone(t, { freq: 1800, dur: .3, type: 'triangle', vol: .1, at: .05 });
    tone(t, { freq: 900, dur: .34, type: 'sine', vol: .08, at: .06 });
    hiss(t, { hp: 5000, dur: .18, vol: .1, at: .04 });
});
// the sound of not having enough for it, which the shop referred to and
// never had: tapping something out of reach used to throw instead of buzz
const buzz = () => safely(t => {
    tone(t, { freq: 190, to: 120, dur: .16, type: 'square', vol: .12 });
    tone(t, { freq: 140, to: 96, dur: .22, type: 'square', vol: .1, at: .1 });
});
document.getElementById('stock').addEventListener('click', e => {
    const btn = e.target.closest('[data-item]');
    if (!btn) return;
    const item = itemById(btn.dataset.item);
    if (!item) return;
    if (!owns(item.id)) {
        if (!tryOn || tryOn.id !== item.id) {            // try it on first
            tryOn = item; plop(2); paintStore(); return;
        }
        if (save.bank < item.price) { buzz(); return; }
        save.bank -= item.price;
        save.owned.push(item.id);
        till();
    } else plop(3);
    tryOn = null;
    save.worn[item.kind] = item.id;
    putSave();
    paintStore();
});
document.getElementById('to-shop').addEventListener('click', openStore);
document.getElementById('store-done').addEventListener('click', () => {
    tryOn = null;
    storeEl.hidden = true;
    deal();
    drawShopfront();
    showBank();
});
let wipeArmed = false;
const wipeBtn = document.getElementById('wipe');
wipeBtn.addEventListener('click', () => {
    if (!wipeArmed) {
        wipeArmed = true;
        wipeBtn.textContent = 'Sure? Everything goes.';
        setTimeout(() => { wipeArmed = false; wipeBtn.textContent = 'Start again from nothing'; }, 4000);
        return;
    }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* never mind */ }
    save = FRESH(); started = false;
    putSave();
    storeEl.hidden = true;
    openSetup();
});

function showShop() {
    money = 0; ledger = []; fed = 0;
    round = 0; live = false; armed = false; tallying = false; teaching = false;
    dog.going = false; dog.chomp = 0;
    clearTimeout(tallyT); clearTimeout(settleT); clearTimeout(teachT);
    countT.forEach(clearTimeout); countT = [];
    tallyEl.classList.remove('on');
    card.hidden = true; card.className = '';
    deal();                       // rebuilt from the save, kit and knife and all
    drawShopfront();
    showingIntro = true;
    document.getElementById('intro').hidden = false;
    document.body.classList.add('waiting');
    draw();
}
function beginWeek() {
    startSession(); audioNow();
    showingIntro = false;
    document.getElementById('intro').hidden = true;
    document.body.classList.remove('waiting');
    startRound(1);            // which sets the HUD, once there is a day to put in it
}
function openStore() {
    startSession(); audioNow();
    tryOn = null;
    paintStore();
    storeEl.hidden = false;
}
/* The ticket ends where the front door starts: another week, or go and spend
   what the last one made. Both of them reset the shop first, so the week
   about to be played is dealt from the save either way. */
document.getElementById('again').addEventListener('click', e => {
    e.stopPropagation();
    showShop();
    beginWeek();
});
document.getElementById('again-shop').addEventListener('click', e => {
    e.stopPropagation();
    showShop();
    openStore();
});
document.getElementById('play').addEventListener('click', e => {
    e.stopPropagation();
    beginWeek();
});

/* Who you are this week, what you are cutting with, and the six of them
   lined up in the order they will turn up. The dogs getting bigger left to
   right is the whole difficulty curve, said without a word. */
/* The sign over the door, and the reason it did not look like one: it was the
   same colour as the wall it hung on, so it read as a plaque drawn onto the
   tiles rather than a board in front of them. Three things fix that - a solid
   dark fascia that contrasts with the wall and throws a shadow onto it, a
   trade line under the name in the way every shop sign ever painted has one,
   and a striped awning underneath, which is the single strongest thing you
   can draw that says shop. The awning takes the butcher's own apron colour,
   so the shop belongs to him. */
function drawFascia(g, name, apron) {
    const x0 = 6, x1 = 334, y0 = 6, y1 = 62;
    g.save();
    g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 12; g.shadowOffsetY = 6;
    g.fillStyle = '#241a16';
    g.beginPath(); g.roundRect(x0, y0, x1 - x0, y1 - y0, 2); g.fill();
    g.shadowColor = 'transparent';
    g.fillStyle = '#c59430';                            // a beaded gold edge
    g.beginPath(); g.roundRect(x0, y0, x1 - x0, 4, 1); g.fill();
    g.beginPath(); g.roundRect(x0, y1 - 4, x1 - x0, 4, 1); g.fill();
    g.strokeStyle = 'rgba(220,171,62,.45)'; g.lineWidth = 1;
    g.strokeRect(x0 + 7, y0 + 8, x1 - x0 - 14, y1 - y0 - 16);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '400 26px "Alfa Slab One", Georgia, serif';
    const room = x1 - x0 - 34, w = g.measureText(name).width;
    g.save();
    g.translate((x0 + x1) / 2, y0 + 26);
    if (w > room) g.scale(room / w, 1);
    g.fillStyle = '#e8c15a';
    g.fillText(name, 0, 0);
    g.restore();
    g.font = '900 9px Lato, system-ui, sans-serif';     // and what the trade is
    g.fillStyle = 'rgba(232,193,90,.62)';
    g.save();
    g.translate((x0 + x1) / 2, y0 + 45);
    g.scale(1, 1);
    for (let i = 0; i < 1; i++) g.fillText('F A M I L Y   B U T C H E R', 0, 0);
    g.restore();

    // the awning: stripes in his own apron, and a scalloped edge on the bottom
    const ay = y1, ah = 26, scallop = 11, n = Math.round((x1 - x0) / (scallop * 2));
    g.save();
    g.shadowColor = 'rgba(0,0,0,.42)'; g.shadowBlur = 10; g.shadowOffsetY = 6;
    g.beginPath();
    g.moveTo(x0 - 4, ay);
    g.lineTo(x1 + 4, ay);
    g.lineTo(x1 + 4, ay + ah);
    for (let i = n - 1; i >= 0; i--) {
        const cx = x0 - 4 + (x1 - x0 + 8) * (i + .5) / n;
        g.arc(cx, ay + ah, (x1 - x0 + 8) / (n * 2), 0, Math.PI, false);
    }
    g.lineTo(x0 - 4, ay + ah);
    g.closePath();
    g.fillStyle = '#f2ece0'; g.fill();
    g.shadowColor = 'transparent';
    g.clip();
    g.fillStyle = apron;
    for (let x = x0 - 12; x < x1 + 12; x += 34) g.fillRect(x, ay - 2, 17, ah + 20);
    g.fillStyle = 'rgba(0,0,0,.16)';                    // it is not flat to the wall
    g.fillRect(x0 - 8, ay, x1 - x0 + 16, 5);
    g.restore();
    g.restore();
}
function drawShopfront() {
    const c = document.getElementById('shopfront'), g = c.getContext('2d');
    g.clearRect(0, 0, 340, 312);
    drawFascia(g, cast.shop, cast.butcher.apron);
    drawButcher(g, true, { cx: 120, cy: 236, k: .64, holds: 'knife' });
    drawDog(g, 264, 248, .76 / cast.dog.k, { open: 0 }, 0, cast.dog);
    // the knife is in his hand and the dog is stood next to him, so the line
    // only has to introduce the two of them
    document.getElementById('cast-line').innerHTML =
        `${cast.butcher.name} and ${cast.dog.dog} the ${cast.dog.name}`;
    showBank();
}
/* Boot: whatever was saved, or a stranger who has to pick a shop first. */
loadSave();
deal();
drawShopfront();
fit();
makeString(1);
dog.s = string.len + 64;          // waiting at the bottom of the title page
draw();
if (!started) openSetup();
</script>
</body>
