<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Butcher's Dog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1c4a39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Butcher's Dog">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Butcher's Dog - cut the sausages off the string before the dog gets to them.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   A BUTCHER'S WINDOW

   Not the squared paper of the other two. Bottle-green glazed tiles, a
   brass rail across the top with the string hanging off it, gold
   signwriting, and no ink outline anywhere: the meat is built from flat
   shapes with the light on one side of them, which is how a sausage is
   drawn and nothing like how a cartoon is.
   ============================================================ */
:root {
    --tile:    #1c4a39;
    --tile-lo: #17402f;
    --grout:   #12362a;
    --shade:   #143d2f;
    --cream:   #f3e9d6;
    --cream-d: #d9cbb0;
    --gold:    #dcab3e;
    --gold-d:  #a87c22;
    --brass:   #c59430;
    --brass-h: #f0d484;
    --meat:    #c4472e;
    --meat-hi: #dd6f4c;
    --meat-lo: #8c2b1b;
    --danger:  #d8462f;
    --good:    #74b985;
    --font:         "Lato", system-ui, -apple-system, sans-serif;
    --font-display: "Alfa Slab One", Georgia, serif;
}
* { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; font-family: var(--font); color: var(--cream); background: var(--tile); }

/* glazed tiles: a grid of grout, a wipe of light down the wall, and the
   corners falling away so it reads as a room rather than a pattern */
#app {
    position: fixed; inset: 0; overflow: hidden; touch-action: none;
    background:
        radial-gradient(130% 80% at 50% 26%, rgba(255,255,255,.10) 0%, transparent 62%),
        radial-gradient(120% 100% at 50% 50%, transparent 46%, rgba(0,0,0,.40) 100%),
        repeating-linear-gradient(0deg, var(--grout) 0 2.5px, transparent 2.5px 48px),
        repeating-linear-gradient(90deg, var(--grout) 0 2.5px, transparent 2.5px 60px),
        linear-gradient(180deg, #235c47 0%, var(--tile) 42%, #163d2f 100%);
}
#pad { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ============================================================
   SIGNWRITING
   Every panel is the same thing: a dark plate, a gold hairline a little
   way inside it, and gold letters. No wonky outlines, no drop shadow.
   ============================================================ */
.sign {
    position: relative;
    background: linear-gradient(180deg, #1a4636, #123327);
    border: 2px solid var(--gold-d); border-radius: 3px;
    box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
}
.sign::after {
    content: ''; position: absolute; inset: 3px; pointer-events: none;
    border: 1px solid rgba(220, 171, 62, .55); border-radius: 1px;
}
#hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 8px;
    padding: 11px 11px; pointer-events: none;
}
.plate {
    display: flex; align-items: center; gap: 7px; padding: 6px 11px 5px;
    font-family: var(--font-display); font-size: 17px; letter-spacing: .01em;
    color: var(--gold); text-shadow: 0 1px 0 rgba(0,0,0,.5);
}
/* every icon in the row is the same size, wherever it hangs - left to itself
   an inline svg with no width takes the whole plate with it */
.sign .ico { width: 13px; height: 13px; fill: var(--gold); flex: none; opacity: .9; }
.plate .of, #till .of {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 9px; padding-left: 10px; border-left: 1px solid rgba(220,171,62,.4);
    font-size: .82em; opacity: .78;
}
#weekno { font-family: var(--font); font-weight: 900; font-size: .58em;
          letter-spacing: .08em; text-transform: uppercase; }
#roundplate.beating { animation: beat .55s ease-in-out infinite alternate; }
#roundplate.beating .of { display: none; }
@keyframes beat { from { box-shadow: 0 2px 0 rgba(0,0,0,.35); }
                  to   { box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 16px rgba(220,171,62,.6); } }
#till {
    display: flex; align-items: center;
    gap: 0; padding: 6px 11px 5px; white-space: nowrap;
    font-family: var(--font-display); font-size: 17px; color: var(--gold);
    text-shadow: 0 1px 0 rgba(0,0,0,.5);
}

#roundplate.hurt { animation: hurt .5s ease-out both; }
@keyframes hurt { 0%, 100% { box-shadow: 0 2px 0 rgba(0,0,0,.35); }
                  30% { box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 20px rgba(216,70,47,.9); } }
#shopfront { width: min(84vw, 330px); height: auto; margin-bottom: 4px;
             animation: butcherIn .6s cubic-bezier(.2, 1.5, .4, 1) both; }
/* the week's takings, day by day */
#ledger { width: 100%; border-collapse: collapse; margin: 4px 0 10px;
          font-size: 13px; font-weight: 700; }
#ledger td { padding: 3px 0; border-bottom: 1px solid rgba(42,33,24,.14); }
#ledger td.d { text-align: left; letter-spacing: .1em; text-transform: uppercase;
               font-size: 11px; opacity: .7; }
#ledger td.w { text-align: left; font-weight: 400; opacity: .5; font-size: 11px; }
#ledger td.m { text-align: right; font-family: var(--font-display); font-size: 15px; }
#ledger tr.shut td { opacity: .35; }
#ledger tr.best td.m { color: #1f7a3f; }
/* the week that ended with a stone in it has no ledger worth printing */
#card.grave #ledger { display: none; }
/* nothing under the total on an ordinary week - but over a headstone the next
   dog has to be introduced */
#rating { display: none; }
#card.grave #rating { display: block; margin-top: 8px; }
#card.grave #score { color: #5a564e; }
#card.grave #ribbon { background: #4b4842; color: #efe7d4; }
#mute {
    margin-left: auto;           /* the row is two plates and a button, not a bar */
    pointer-events: auto; cursor: pointer; padding: 7px 8px 4px; line-height: 0;
    background: linear-gradient(180deg, #1a4636, #123327);
    border: 2px solid var(--gold-d); border-radius: 3px;
}
#mute:active { transform: translateY(1px); }
#mute .off { display: none; }
#mute.muted .on { display: none; }
#mute.muted .off { display: inline; }


/* The count is the only thing on the screen that is about to matter, so it
   gets the middle of it. What day it is is a caption, and captions go at the
   bottom where the prompt always went. */
#banner {
    position: absolute; left: 0; right: 0; top: 50%; z-index: 4;
    transform: translateY(-50%);
    text-align: center; pointer-events: none; opacity: 0;
    font-family: var(--font-display); color: var(--gold);
    text-shadow: 0 3px 0 rgba(0,0,0,.45);
}
/* In the middle of the window it lands on top of the sausages, so it carries
   its own dark outline rather than relying on whatever is behind it */
#banner .r {
    display: block; font-size: clamp(46px, 16vw, 78px); line-height: 1; letter-spacing: .01em;
    text-shadow:
        0 0 16px rgba(8,22,17,.95),
        3px 3px 0 rgba(8,22,17,.92), -3px 3px 0 rgba(8,22,17,.92),
        3px -3px 0 rgba(8,22,17,.92), -3px -3px 0 rgba(8,22,17,.92),
        0 5px 0 rgba(0,0,0,.45);
}
#banner .r.go-word { font-size: clamp(38px, 13vw, 62px); color: #8fd6a2; }
#banner.go { animation: bannerGo .62s ease-out both; }
@keyframes bannerGo {
    0%   { transform: translateY(-50%) scale(1.4); opacity: 0; }
    16%  { transform: translateY(-50%) scale(1); opacity: 1; }
    72%  { transform: translateY(-50%) scale(1); opacity: 1; }
    100% { transform: translateY(-50%) scale(.92); opacity: 0; }
}

/* The day's takings, over the middle of the window rather than the bottom of
   it - the dog finishes wherever it got to, and the bottom of the string is
   exactly where it usually is. On its own plate, so it reads over whatever
   is behind it. */
#tally {
    position: absolute; left: 50%; top: 32%; z-index: 9;
    transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; display: none;
    width: max-content; max-width: min(80vw, 290px); padding: 13px 22px 11px;
    background: rgba(12, 34, 26, .88);
    border: 2px solid var(--gold-d); border-radius: 3px;
    box-shadow: 0 4px 0 rgba(0,0,0,.4);
}
#tally.on { display: block; animation: tallyIn .3s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes tallyIn { from { transform: translate(-50%, -44%) scale(.92); opacity: 0; }
                     to   { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
#tally .n {
    display: block; font-family: var(--font-display); font-size: clamp(40px, 13vw, 58px);
    line-height: 1; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.45);
}
#tally .l { display: block; font-family: var(--font); font-weight: 900; font-size: 15px;
            text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; line-height: 1.25; }
#tally .b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em;
            text-transform: uppercase; opacity: .5; margin-top: 5px; }

/* ---- the front door ---------------------------------------------------
   A phone browser will not let a freshly loaded page make a sound on the
   first touch it receives, so the first press has to be spent on something
   that is not the game. Pressing Open is what opens the audio. */
#intro {
    position: absolute; inset: 0; z-index: 12;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 22px 6%; text-align: center;
    background: linear-gradient(transparent 4%, rgba(18,51,39,.85) 46%, #123327 62%);
    animation: introIn .5s ease-out both;
}
@keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
#intro[hidden] { display: none; }
body.waiting #hud { display: none; }
#intro h1 {
    margin: 0 0 20px; font-family: var(--font-display); font-weight: 400; color: var(--gold);
    font-size: clamp(38px, 13.5vw, 60px); line-height: .98; letter-spacing: .01em;
    text-shadow: 0 4px 0 rgba(0,0,0,.45);
}
#intro .rule {
    width: 132px; height: 2px; margin: 16px 0 12px;
    background: linear-gradient(90deg, transparent, var(--gold-d), transparent);
}
#intro p { margin: 0; max-width: 330px; font-size: 13px; font-weight: 700;
           line-height: 1.6; letter-spacing: .04em; opacity: .74; }
#intro .btn { margin-top: 14px; width: 100%; max-width: 236px; }
.btn.ghost {
    background: linear-gradient(180deg, #1a4636, #123327); color: var(--gold);
    border-color: var(--gold-d); box-shadow: 0 3px 0 rgba(0,0,0,.4);
    font-size: 15px; padding: 9px; margin-top: 9px;
}
.bank { margin-top: 14px; font-size: 12px; font-weight: 700; letter-spacing: .12em;
        text-transform: uppercase; opacity: .6; }
.bank b { font-family: var(--font-display); font-size: 17px; letter-spacing: .02em;
          color: var(--gold); opacity: 1; margin-left: 5px; }

/* ---- picking your lot, and spending what you have ---------------------- */
#setup, #store {
    position: absolute; inset: 0; z-index: 13; overflow-y: auto;
    /* safe centring: a shelf taller than the window centres its own top off
       the screen, and no amount of scrolling gets it back */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    justify-content: safe center;
    padding: 22px 18px; text-align: center;
    background:
        radial-gradient(120% 80% at 50% 30%, rgba(255,255,255,.06) 0%, transparent 60%),
        repeating-linear-gradient(0deg, var(--grout) 0 2.5px, transparent 2.5px 48px),
        repeating-linear-gradient(90deg, var(--grout) 0 2.5px, transparent 2.5px 60px),
        linear-gradient(180deg, #1c4a39 0%, #16402f 60%, #102b21 100%);
    animation: introIn .3s ease-out both;
}
#setup[hidden], #store[hidden] { display: none; }
#setup h2, #store h2 {
    margin: 0 0 10px; font-family: var(--font-display); font-weight: 400;
    font-size: 30px; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.4);
}
#preview { width: min(76vw, 300px); height: auto; }
#stock-dog { width: min(50vw, 200px); height: auto; }
.rows { width: 100%; max-width: 320px; margin: 10px 0 4px; }
.row {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; margin-bottom: 7px;
    background: linear-gradient(180deg, #1a4636, #123327);
    border: 2px solid var(--gold-d); border-radius: 3px;
}
.row .lab { flex: none; width: 74px; text-align: left; font-size: 11px; font-weight: 900;
            letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
.row b { flex: 1; font-family: var(--font-display); font-weight: 400; font-size: 17px;
         color: var(--cream); letter-spacing: .02em; }
.row input {
    flex: 1; min-width: 0; background: rgba(0,0,0,.25); color: var(--cream);
    border: 1px solid rgba(220,171,62,.35); border-radius: 2px;
    font-family: var(--font-display); font-weight: 400; font-size: 16px;
    padding: 5px 8px; text-align: center; letter-spacing: .02em;
}
.row input:focus { outline: none; border-color: var(--gold); }
.nudge {
    flex: none; width: 34px; padding: 5px 0; cursor: pointer;
    background: var(--brass); color: #2a2118; border: 2px solid #2a2118; border-radius: 3px;
    font-family: var(--font-display); font-size: 17px; line-height: 1;
}
.nudge:active { transform: translateY(1px); }
#stock { width: 100%; max-width: 330px; margin: 8px 0 4px; }
.shelf { margin-bottom: 10px; }
.shelf h3 {
    margin: 0 0 5px; font-size: 10px; font-weight: 900; letter-spacing: .16em;
    text-transform: uppercase; color: var(--gold); opacity: .75; text-align: left;
}
/* A shop tells you what a thing looks like, not what it is called: every
   item is drawn on the dog's own head in its own little window, so a rack of
   seventeen hats reads at a glance instead of being seventeen words. */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.buy {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 3px 2px 4px; cursor: pointer; overflow: hidden;
    background: linear-gradient(180deg, #1a4636, #123327);
    border: 2px solid var(--gold-d); border-radius: 3px; color: var(--cream);
    font-family: var(--font); font-weight: 700; font-size: 13px;
}
.buy canvas { width: 100%; height: auto; display: block; }
.buy .pr { font-family: var(--font-display); font-size: 12px; color: var(--gold);
           line-height: 1.1; }
.buy .tag { font-size: 8px; font-weight: 900; letter-spacing: .08em;
            text-transform: uppercase; line-height: 1.5; }
.buy.worn { border-color: var(--gold); }
.buy.trying { border-color: var(--gold); background: linear-gradient(180deg, #24593f, #1a4132); }
.buy.trying .pr, .buy.trying .tag { color: var(--gold); }
.buy.worn .tag { color: #8fd6a2; }
.buy.poor { opacity: .42; }
.buy:active { transform: translateY(1px); }
.wipe {
    margin-top: 16px; background: none; border: none; cursor: pointer;
    font-family: var(--font); font-size: 10px; font-weight: 900; letter-spacing: .12em;
    text-transform: uppercase; color: var(--danger); opacity: .65;
}

/* ============================================================
   THE TICKET
   ============================================================ */
/* The end of the day takes the whole window. Everything else is cleared away
   and the man whose shop it is stands there with the takings, which says more
   about how it went than the number does. */
#card {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    justify-content: safe center;
    gap: 2px; padding: 20px 18px; pointer-events: auto; overflow-y: auto;
    background:
        radial-gradient(120% 80% at 50% 34%, rgba(255,255,255,.07) 0%, transparent 60%),
        radial-gradient(120% 100% at 50% 50%, transparent 40%, rgba(0,0,0,.55) 100%),
        repeating-linear-gradient(0deg, var(--grout) 0 2.5px, transparent 2.5px 48px),
        repeating-linear-gradient(90deg, var(--grout) 0 2.5px, transparent 2.5px 60px),
        linear-gradient(180deg, #1c4a39 0%, #16402f 60%, #102b21 100%);
    animation: introIn .34s ease-out both;
}
#card[hidden] { display: none; }
#butcher {
    width: min(74vw, 292px); height: auto; flex: none;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.45));
    animation: butcherIn .55s cubic-bezier(.2, 1.5, .4, 1) both;
}
@keyframes butcherIn { from { transform: translateY(26px) scale(.9); opacity: 0; }
                       to   { transform: none; opacity: 1; } }
#card .inner {
    position: relative; flex: none; pointer-events: auto;
    animation: sheetIn .34s cubic-bezier(.2, 1.3, .4, 1) .12s both;
    width: 100%; max-width: 316px; padding: 22px 20px 20px;
    background: linear-gradient(180deg, #faf4e6, #eadfc6);
    border: 3px solid #2a2118; border-radius: 4px;
    box-shadow: 0 10px 0 rgba(0,0,0,.30); text-align: center; color: #2a2118;
}
#card .inner::after {
    content: ''; position: absolute; inset: 6px; pointer-events: none;
    border: 1.5px solid rgba(42,33,24,.35);
}
@keyframes sheetIn { from { transform: translateY(26px); opacity: 0; }
                     to   { transform: translateY(0); opacity: 1; } }
#ribbon {
    position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 14px; letter-spacing: .16em; white-space: nowrap;
    padding: 5px 18px 4px; background: var(--danger); color: #fff5e6;
    border: 2.5px solid #2a2118; border-radius: 2px; z-index: 3;
    animation: ribbonIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes ribbonIn { from { transform: translateX(-50%) scale(.6); opacity: 0; }
                      to   { transform: translateX(-50%) scale(1); opacity: 1; } }
#card.record #ribbon { background: var(--gold); color: #2a2118; }
#card #score {
    display: block; font-family: var(--font-display); font-size: 48px; line-height: 1;
    color: #b03a25; margin: 8px 0 0;
}
#card.record #score { color: #a8791e; }
#card .btn.ghost {
    background: transparent; color: #2a2118; border-color: #2a2118;
    box-shadow: 0 3px 0 rgba(0,0,0,.22); font-size: 15px; padding: 10px; margin-top: 8px;
}
/* the caption sits under the number rather than beside it - "for the week"
   alongside a five-figure total wraps, and wraps badly */
#score .pc { display: block; font-size: .24em; letter-spacing: .16em;
             text-transform: uppercase; opacity: .6; margin-top: 4px; }
#rating { margin: 6px 0 0; font-family: var(--font); font-weight: 900; font-size: 17px;
          text-transform: uppercase; letter-spacing: .06em; }
#pass { margin: 7px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .12em;
        text-transform: uppercase; opacity: .55; }
.btn {
    margin-top: 16px; width: 100%;
    font-family: var(--font-display); font-size: 17px; font-weight: 400; letter-spacing: .04em;
    padding: 13px; color: #2a2118;
    background: linear-gradient(180deg, #e8be55, var(--brass));
    border: 2.5px solid #2a2118; border-radius: 3px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }

#app.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
    10%, 90% { transform: translate3d(-3px, 1px, 0); }
    20%, 80% { transform: translate3d(7px, -2px, 0); }
    30%, 50%, 70% { transform: translate3d(-11px, 2px, 0); }
    40%, 60% { transform: translate3d(11px, -1px, 0); }
}
#version { position: absolute; bottom: 7px; right: 10px; z-index: 3;
           font-size: 9px; font-weight: 700; letter-spacing: .14em;
           text-transform: uppercase; color: var(--cream); opacity: .22; }

@media (max-height: 700px) {
    #butcher { width: min(56vw, 216px); }
    #card #score { font-size: 40px; }
    #ledger { font-size: 12px; margin: 2px 0 6px; }
}
@media (max-width: 400px) {
    #hud { padding: 9px 9px; gap: 6px; }
    .plate { font-size: 13px; padding: 5px 7px 4px; }
    .plate .ico { width: 12px; height: 12px; }
    #quota { padding: 5px 7px; }
    #mute { padding: 6px 7px 3px; }
    #mute svg { width: 18px; height: 18px; }
}
</style>
</head>

<script>
const APP_VERSION = 'v15';
document.getElementById('version').textContent = `Butcher's Dog ${APP_VERSION}`;

/* ============================================================
   SOUND
   All of it synthesised - there is not a recording in the project. The
   unlock dance below is the one Perfect Circle paid for in full: a phone
   browser will not open an audio session on a page's first touch, so the
   Play button spends it, and everything is scheduled against a clock that
   has been seen to move rather than one that claims to be running.
   ============================================================ */
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, master = null, soundOn = true;
const soundKey = 'bd-sound';
try { soundOn = localStorage.getItem(soundKey) !== 'off'; } catch (e) { /* private mode */ }

function audioNow() {
    if (!audioCtx) {
        audioCtx = new AC();
        master = audioCtx.createGain();
        master.gain.value = .7;
        master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx.currentTime;
}
function tone(t0, { freq, to, dur = .18, type = 'triangle', vol = .2, at = 0 }) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + at;
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), s + dur);
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .012);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(g); g.connect(master);
    o.start(s); o.stop(s + dur + .02);
}
const LEAD = .025;
let clockGoing = false;
function whenRunning(fn) {
    try {
        audioNow();
        const go = () => { clockGoing = true; fn(audioCtx.currentTime + LEAD); };
        if (clockGoing || audioCtx.currentTime > 0) return go();
        audioCtx.resume().catch(() => {});
        let tries = 0;
        const waitForTheClock = () => {
            if (audioCtx.currentTime > 0) return go();
            if (tries === 30) startSession();
            if (++tries > 90) return;
            requestAnimationFrame(waitForTheClock);
        };
        waitForTheClock();
    } catch (e) { /* no audio here, never mind */ }
}
const safely = fn => { if (!soundOn) return; whenRunning(fn); };
let noiseBuf = null;
function noise() {
    if (!noiseBuf) {
        const len = Math.floor(audioCtx.sampleRate * .6);
        noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }

}
function hiss(t0, { hp = 1200, lp = 16000, dur = .12, vol = .3, at = 0 }) {
    const n = audioCtx.createBufferSource(), h = audioCtx.createBiquadFilter(),
          l = audioCtx.createBiquadFilter(), g = audioCtx.createGain(), s = t0 + at;
    n.buffer = noise();

    l.type = 'lowpass';  l.frequency.value = lp;
    g.gain.setValueAtTime(vol, s);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    n.connect(h); h.connect(l); l.connect(g); g.connect(master);
    n.start(s); n.stop(s + dur + .02);
}
/* Noise pushed through a filter that slides down as it goes, which is what
   nearly everything in this game actually sounds like: a blade is bright at
   the top of the stroke and dull at the bottom of it, and so is a jaw. */
function sweep(t0, { from = 6000, to = 1400, q = 3, dur = .12, vol = .3, at = 0 }) {
    const n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(),

    f.frequency.exponentialRampToValueAtTime(Math.max(60, to), s + dur);
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .008);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    n.connect(f); f.connect(g); g.connect(master);
    n.start(s); n.stop(s + dur + .02);
}
/* The knife. Two sweeps an instant apart - the wide one is the draw of the
   blade, the narrow one is the edge finding the skin - and a ring over the
   top that only a good cut earns. All of it pitched by the quality, so a
   square cut through the middle of a twist sounds different from one that
   only just counted, and you learn the difference without being told. */
const snick = q => safely(t => {
    const k = .72 + q / 150;
    sweep(t, { from: 7800 * k, to: 1500, q: 2, dur: .105, vol: .34 });
    sweep(t, { from: 2700 * k, to: 820, q: 7, dur: .07, vol: .18, at: .012 });
    tone(t, { freq: 1500 * k, to: 3000 * k, dur: .05, type: 'triangle', vol: .075, at: .006 });
    const ring = cast ? cast.knife.ring : 1;     // a cleaver does not sing
    if (q > 72 && ring) {
        tone(t, { freq: 3200 * k * ring, dur: .3, type: 'sine', vol: .05 * ring, at: .04 });
        tone(t, { freq: 4700 * k * ring, dur: .22, type: 'sine', vol: .028 * ring, at: .055 });
    }
});
// a cut through the middle of a sausage, which is not a cut, it is a mess
const squelch = () => safely(t => {
    sweep(t, { from: 900, to: 140, q: 1, dur: .19, vol: .38 });
    tone(t, { freq: 190, to: 64, dur: .22, type: 'sawtooth', vol: .17 });
    tone(t, { freq: 95, to: 42, dur: .26, type: 'sine', vol: .13, at: .02 });
});
// a sausage landing in the tray
const plop = n => safely(t => {
    tone(t, { freq: 330 + n * 26, dur: .1, type: 'triangle', vol: .16 });
    tone(t, { freq: 660 + n * 52, dur: .07, type: 'sine', vol: .08, at: .02 });
});
/* The dog, in two parts. It starts growling as it comes up off the string -
   a low buzz that will not sit still, which is a handful of detuned saws with
   a rasp of noise dragged across them - and the snap lands a moment later,
   followed by the two chews and the gulp it takes to get one down. */
const snarl = () => safely(t => {
    for (const [f, v] of [[98, .17], [147, .085], [62, .11]])
        tone(t, { freq: f * 1.14, to: f * .80, dur: .38, type: 'sawtooth', vol: v });
    sweep(t, { from: 1000, to: 240, q: 1.1, dur: .38, vol: .2 });
    for (let i = 0; i < 8; i++)                       // the roughness in it
        hiss(t, { hp: 170, lp: 1500, dur: .045, vol: .10 + .05 * Math.sin(i * 1.7), at: i * .044 });
});
const chomp = () => safely(t => {
    sweep(t, { from: 2800, to: 280, q: 1.4, dur: .07, vol: .42 });     // the jaw shutting
    tone(t, { freq: 195, to: 50, dur: .1, type: 'square', vol: .25 });
    tone(t, { freq: 88, to: 42, dur: .17, type: 'sine', vol: .2, at: .008 });
    for (let i = 1; i <= 2; i++) {                                      // and chewing it down
        sweep(t, { from: 1500, to: 360, q: 2, dur: .05, vol: .17, at: .17 * i });
        tone(t, { freq: 150, to: 68, dur: .07, type: 'square', vol: .11, at: .17 * i });
    }
    tone(t, { freq: 300, to: 110, dur: .24, type: 'sawtooth', vol: .11, at: .44 });   // the gulp
});
const woof = () => safely(t => {
    tone(t, { freq: 420, to: 150, dur: .13, type: 'sawtooth', vol: .2 });
    tone(t, { freq: 210, to: 84, dur: .18, type: 'square', vol: .14, at: .02 });
    hiss(t, { hp: 400, lp: 3000, dur: .1, vol: .14 });
});
const jingleWin = () => safely(t => {
    const M = [[0, 392, .16], [.16, 523, .16], [.32, 659, .16], [.48, 784, .30],
               [.80, 880, .16], [.96, 784, .16], [1.12, 659, .16], [1.28, 698, .16],
               [1.44, 880, .16], [1.60, 784, .16], [1.76, 659, .16], [1.92, 1046, .80]];
    M.forEach(([at, freq, dur]) => tone(t, { freq, dur, type: 'triangle', vol: .17, at }));
    M.forEach(([at, freq, dur]) => tone(t, { freq: freq / 2, dur, type: 'sine', vol: .07, at }));
    [[0, 131], [.48, 196], [.96, 175], [1.44, 196]].forEach(([at, freq]) =>
        tone(t, { freq, dur: .46, type: 'sine', vol: .12, at }));
    [262, 330, 392, 523].forEach(freq => tone(t, { freq, dur: 1, type: 'triangle', vol: .08, at: 1.92 }));
    tone(t, { freq: 131, dur: 1.05, type: 'sine', vol: .13, at: 1.92 });
    hiss(t, { hp: 6000, dur: .5, vol: .1, at: 1.94 });
});
const jingleLose = () => safely(t => {
    const M = [[0, 330, 311, .30], [.34, 294, 277, .30], [.68, 262, 247, .30],
               [1.02, 247, 233, .34], [1.40, 220, 196, .50]];
    M.forEach(([at, freq, to, dur]) => {
        tone(t, { freq, to, dur, type: 'sawtooth', vol: .13, at });
        tone(t, { freq: freq * 1.007, to: to * 1.007, dur, type: 'sawtooth', vol: .06, at });
    });
    [[0, 110], [.68, 98], [1.40, 110]].forEach(([at, freq]) =>
        tone(t, { freq, dur: .62, type: 'triangle', vol: .11, at }));
    tone(t, { freq: 208, to: 92, dur: 1.05, type: 'sawtooth', vol: .16, at: 1.96 });
    hiss(t, { hp: 120, lp: 800, dur: .4, vol: .1, at: 2.55 });
});

const SILENCE = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
let wake = null;
function startSession() {
    try {
        if (!wake) {
            wake = new Audio(SILENCE);
            wake.loop = true; wake.volume = 1; wake.muted = false;
            wake.setAttribute('playsinline', '');
        }
        const r = wake.play();
        if (r && r.then) r.then(() => setTimeout(() => {
            if (audioCtx && audioCtx.state !== 'running' && audioCtx.currentTime === 0) rebuild();
        }, 260)).catch(() => {});
    } catch (e) { /* no audio here, never mind */ }
}
let rebuilt = false;
function rebuild() {
    if (rebuilt) return;
    rebuilt = true;
    try {
        try { audioCtx.close(); } catch (e) { /* never mind */ }
        audioCtx = null; master = null; keepAwake = null; unlocked = false; clockGoing = false;
        unlockAudio();
    } catch (e) { /* no audio here, never mind */ }
}
let unlocked = false, keepAwake = null;
function unlockAudio() {
    try {
        startSession();
        audioNow();
        if (unlocked) return;
        unlocked = true;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        g.gain.value = 0; o.frequency.value = 30;
        o.connect(g); g.connect(audioCtx.destination);
        o.start();
        keepAwake = o;
    } catch (e) { /* no audio here, never mind */ }
}
for (const ev of ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'])
    addEventListener(ev, unlockAudio, { capture: true, passive: true });
addEventListener('visibilitychange', () => {
    if (!document.hidden && audioCtx && audioCtx.state === 'suspended')
        audioCtx.resume().catch(() => {});
});

const muteBtn = document.getElementById('mute');
const applySound = () => muteBtn.classList.toggle('muted', !soundOn);
muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    soundOn = !soundOn;
    try { localStorage.setItem(soundKey, soundOn ? 'on' : 'off'); } catch (e) { /* private mode */ }
    applySound();
    if (soundOn) plop(2);
});
applySound();

/* ============================================================
   THE STRING

   A string of sausages is one curve with fat bits on it. So it is held as
   a path - sampled into a polyline with its arc length alongside - and
   everything else is a position along that path: where a twist is, where
   you cut, where the dog has got to. Nothing needs to know the shape.
   ============================================================ */
const cv = document.getElementById('pad'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function fit() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (string) layout();
    [knife.x, knife.y, knife.ang] = restPose();
    draw();
}
addEventListener('resize', fit);

const now = () => performance.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[(Math.random() * a.length) | 0];

let string = null;          // { pts, cum, len, n, wiggle }
/* The string hangs down the screen rather than across it, because a phone is
   tall and a thumb swipes sideways comfortably. Later rounds put more sway
   in it, which is what makes a square cut something you have to aim. */
function makePath(n, wiggle, phase) {
    const top = RAIL + 26, bot = H - 104, span = bot - top;
    const pts = [];
    const SAMPLES = 300;
    for (let i = 0; i <= SAMPLES; i++) {
        const t = i / SAMPLES, y = top + span * t;
        const x = W / 2 + Math.sin(t * Math.PI * 2 * wiggle + phase) * (W * .24);
        pts.push([x, y]);
    }
    const cum = [0];
    for (let i = 1; i < pts.length; i++)
        cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { pts, cum, len: cum[cum.length - 1] };
}
// where along the path is that, and which way is it going
function at(s) {
    const { pts, cum } = string;
    s = clamp(s, 0, string.len);
    let lo = 0, hi = cum.length - 1;
    while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= s) lo = mid; else hi = mid; }
    const seg = cum[hi] - cum[lo] || 1, f = (s - cum[lo]) / seg;
    const x = pts[lo][0] + (pts[hi][0] - pts[lo][0]) * f;
    const y = pts[lo][1] + (pts[hi][1] - pts[lo][1]) * f;
    const tx = (pts[hi][0] - pts[lo][0]) / seg, ty = (pts[hi][1] - pts[lo][1]) / seg;
    return [x, y, tx, ty];
}

/* A piece is a run of sausages still joined together. Cutting a twist splits
   a piece in two; a piece of one sausage is off the string and yours. The
   dog eats whatever piece it reaches, one sausage at a time. */
let pieces = [], loose = [], saved = 0, lost = 0;
const TWIST = 15;               // how much of the string a twist takes up

function layout() {
    const { n, wiggle, phase } = string;
    Object.assign(string, makePath(n, wiggle, phase));
}
// the day decides how much is on the string and how much sway is in it
function makeString(day) {
    const i = Math.min(DAYS.length, Math.max(1, day)) - 1, D = DAYS[i];
    const n = cast.days[i], wiggle = D.wiggle;
    string = { n, wiggle, phase: Math.random() * Math.PI * 2 };
    layout();
    // one piece holding the lot, and the twists evenly spaced down it
    string.twists = [];
    for (let i = 1; i < n; i++) string.twists.push(string.len * i / n);
    pieces = [{ from: 0, to: n - 1 }];

    return n;
}
// the arc range a run of sausages covers, twists and all
const spanOf = p => [p.from === 0 ? 0 : string.twists[p.from - 1],

/* ---- the cut ----------------------------------------------------------
   A swipe is a polyline, and every place it crosses the string is a cut.
   Land on a twist and the string parts there; land on a sausage and you
   have halved something nobody will buy. One swipe can do several of both,
   which is the whole game: a long diagonal through three twists is worth
   more than three careful little ones, and costs you everything if it is
   half a centimetre out. */
function crossings(swipe) {
    const out = [];
    const { pts, cum } = string;
    for (let i = 1; i < swipe.length; i++) {
        const [ax, ay] = swipe[i - 1], [bx, by] = swipe[i];
        const rx = bx - ax, ry = by - ay;
        for (let j = 1; j < pts.length; j++) {
            const [cx, cy] = pts[j - 1], [dx, dy] = pts[j];
            const sx = dx - cx, sy = dy - cy;
            const den = rx * sy - ry * sx;
            if (!den) continue;
            const u = ((cx - ax) * sy - (cy - ay) * sx) / den;   // along the swipe
            const v = ((cx - ax) * ry - (cy - ay) * rx) / den;   // along the string
            if (u < 0 || u > 1 || v < 0 || v > 1) continue;
            const s = cum[j - 1] + (cum[j] - cum[j - 1]) * v;
            const len = Math.hypot(rx, ry) || 1;
            out.push({ s, dx: rx / len, dy: ry / len, x: ax + rx * u, y: ay + ry * u });
        }

    out.sort((a, b) => a.s - b.s);

    return out.filter((c, i) => i === 0 || c.s - out[i - 1].s > TWIST);

// which piece covers that point of the string, if any is still there
function pieceAt(s) {
    for (const p of pieces) { const [a, b] = spanOf(p); if (s >= a && s <= b) return p; }
    return null;
}
const sausageAt = s => {
    let i = 0;
    while (i < string.n - 1 && s > string.twists[i]) i++;
    return i;
};

/* What one swipe is worth is not the sum of its cuts. Taking two twists in a
   stroke, or three, is the only thing in the game that asks for more than a
   steady hand - you have to find the line that passes through all of them
   square-ish and miss every sausage on the way - so it pays in the only
   currency here, which is time: the dog hears the knife and backs off down
   the string. Spoil a sausage in the same swipe and it pays nothing, because
   then it was not a good line, it was a lucky one. */

   that the outline has a corner in it, and nothing on a sausage has a corner.

   and meets the sausage flat and has no corner anywhere. */

        w = Math.min(w, thin + (w - thin) * shoulder(t));

   score there is, so two weeks are only worth comparing if they were worth
   the same money to begin with - a week that happened to deal forty-one would
   beat a week that dealt thirty-seven before either of you picked up a knife.

   What varies is how they are spread. A sausage is moved from one day to
   another a dozen times, never taking a day more than two from where it
   started, so Thursday might be a heavy one this week and a light one the
   next - but the sum cannot drift, because nothing is ever created or
   destroyed, only moved. */
const WEEK_TOTAL = DAYS.reduce((t, d) => t + d.n, 0);
function dealDays() {
    const n = DAYS.map(d => d.n);
    for (let i = 0; i < 12; i++) {
        const a = (Math.random() * DAYS.length) | 0, b = (Math.random() * DAYS.length) | 0;
        if (a === b) continue;
        if (n[a] - 1 < Math.max(3, DAYS[a].n - 2)) continue;
        if (n[b] + 1 > DAYS[b].n + 2) continue;
        n[a]--; n[b]++;
    }
    return n;
}

/* ---- whose shop it is ---------------------------------------------------

               'The Merchant of Venison', 'Best of the Wurst', 'Fillet of Soul',

const KNIVES = [

const KIT = [

    { id: 'party',    kind: 'hat',    name: 'Party hat',        price: 2600 },

const itemById = id => STOCK.find(i => i.id === id);

/* ---- the save ------------------------------------------------------------
   One object, one key. Everything that survives the week is in here. */
const SAVE_KEY = 'bd-shop-1';
const FRESH = () => ({
    butcher: 0, tier: 2, breed: 0, dogName: 'Nipper', shop: 'A Cut Above',
    bank: 0, weeks: 0,
    owned: ['blade', 'bare', 'plain', 'spiked'],
    worn: { knife: 'blade', hat: 'bare', face: 'plain', collar: 'spiked' },
});
let save = FRESH(), started = false;
function loadSave() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
            save = Object.assign(FRESH(), JSON.parse(raw));
            // the chef's hat used to share an id with the butcher's knife
            if (save.worn.hat === 'chef') save.worn.hat = 'chefhat';
            started = true;
        }
    } catch (e) { /* private mode: play it as a stranger every time */ }
}
function putSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* never mind */ }
}
const owns = id => save.owned.includes(id);
const wearing = kind => itemById(save.worn[kind]) || STOCK.find(i => i.kind === kind);

/* What the week is played with, built from the save rather than dealt. The
   breed is looks and nothing else now that you pick it: every one of the
   twelve runs at exactly the same speed, or choosing the dachshund would be
   choosing an easier week. */
let cast = null;
function deal() {
    const B = TIERS[clamp(save.tier, 0, TIERS.length - 1)][clamp(save.breed, 0, 1)];
    cast = {
        butcher: BUTCHERS[clamp(save.butcher, 0, BUTCHERS.length - 1)],
        shop: save.shop,
        knife: wearing('knife'),
        kit: { hat: wearing('hat').id, face: wearing('face').id, collar: wearing('collar').id },
        dog: { ...B, dog: save.dogName, speed: 1 },
        days: dealDays(),
    };
}
const breedFor = () => cast.dog;

/* Drawn on the same terms as the meat: no outline, just shapes with the light
   on one side. `pose` is where it is in a bite - how far the jaw is open, how
   far it has reached up the string, and the squash on the moment of contact. */
/* ---- what the dog is wearing --------------------------------------------
   All of it drawn in the dog's own coordinates, so it fits a dachshund and a
   mastiff without being told which it is on: hats sit on the top of the skull
   at -skullH, faces on the eye line, collars at the chin. None of it touches
   how the game plays. The onesies are hoods, because a dog drawn from the
   neck up cannot wear a onesie any other way. */
function drawKit(ctx, B, kit, glum) {
    if (!kit) return;
    const blob = (fill, path) => { ctx.beginPath(); path(); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
    const T = -B.skullH, W2 = B.skullW;               // top of the head, half its width

    switch (kit.face) {
    case 'specs':
        ctx.strokeStyle = '#2a201a'; ctx.lineWidth = 3;
        for (const sx of [-1, 1]) {
            ctx.beginPath(); ctx.arc(sx * B.eyes[0], B.eyes[1], B.eyes[2] + 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(210,235,245,.28)'; ctx.fill(); ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(-B.eyes[0] + B.eyes[2] + 5, B.eyes[1]); ctx.lineTo(B.eyes[0] - B.eyes[2] - 5, B.eyes[1]);
        ctx.stroke();
        break;
    case 'shades':
        blob('#23202a', () => {
            ctx.moveTo(-W2 - 3, B.eyes[1] - 9); ctx.lineTo(W2 + 3, B.eyes[1] - 9);
            ctx.lineTo(W2 - 1, B.eyes[1] + 7); ctx.lineTo(5, B.eyes[1] + 9);
            ctx.lineTo(0, B.eyes[1] - 1); ctx.lineTo(-5, B.eyes[1] + 9);
            ctx.lineTo(-W2 + 1, B.eyes[1] + 7);
        });
        blob('rgba(255,255,255,.22)', () => {
            ctx.moveTo(-W2 + 2, B.eyes[1] - 6); ctx.lineTo(-W2 + 13, B.eyes[1] - 6);
            ctx.lineTo(-W2 + 6, B.eyes[1] + 5); ctx.lineTo(-W2 + 1, B.eyes[1] + 4);
        });
        break;
    case 'patch':
        blob('#1c1a1e', () => ctx.ellipse(-B.eyes[0], B.eyes[1], B.eyes[2] + 6, B.eyes[2] + 5, 0, 0, Math.PI * 2));
        ctx.strokeStyle = '#1c1a1e'; ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(-B.eyes[0] - B.eyes[2] - 5, B.eyes[1] - 5); ctx.lineTo(-W2 - 4, B.eyes[1] - 13);
        ctx.moveTo(-B.eyes[0] + B.eyes[2] + 4, B.eyes[1] - 7); ctx.lineTo(W2 + 2, B.eyes[1] - 16);
        ctx.stroke();
        break;
    case 'nose':
        blob('#d8322c', () => ctx.arc(0, B.snout[2] - B.snout[1] * .55, 12, 0, Math.PI * 2));
        blob('rgba(255,255,255,.38)', () => ctx.ellipse(-4, B.snout[2] - B.snout[1] * .55 - 4, 4, 3, -.4, 0, Math.PI * 2));
        break;
    case 'tash':
        blob('#3a2a1c', () => {
            const y = B.snout[2] - B.snout[1] * .1;
            ctx.moveTo(0, y - 3);
            ctx.quadraticCurveTo(-16, y - 9, -30, y - 14);
            ctx.quadraticCurveTo(-24, y + 6, 0, y + 4);
            ctx.quadraticCurveTo(24, y + 6, 30, y - 14);
            ctx.quadraticCurveTo(16, y - 9, 0, y - 3);
        });
        break;
    case 'goggles':
        blob('#6b4a26', () => { ctx.rect(-W2 - 4, B.eyes[1] - 12, (W2 + 4) * 2, 8); });
        for (const sx of [-1, 1]) {
            blob('#c9a44a', () => ctx.arc(sx * B.eyes[0], B.eyes[1], B.eyes[2] + 8, 0, Math.PI * 2));
            blob('#8fd2e0', () => ctx.arc(sx * B.eyes[0], B.eyes[1], B.eyes[2] + 4.5, 0, Math.PI * 2));
            blob('rgba(255,255,255,.45)', () => ctx.ellipse(sx * B.eyes[0] - 3, B.eyes[1] - 3, 4, 3, -.5, 0, Math.PI * 2));
        }
        break;
    case 'monocle':
        ctx.strokeStyle = '#dcab3e'; ctx.lineWidth = 3.4;
        ctx.beginPath(); ctx.arc(B.eyes[0], B.eyes[1], B.eyes[2] + 7, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(210,235,245,.25)'; ctx.fill(); ctx.stroke();
        ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(B.eyes[0] + B.eyes[2] + 6, B.eyes[1] + 5);
        ctx.quadraticCurveTo(W2 + 10, B.eyes[1] + 26, W2 + 2, B.chin - 6);
        ctx.stroke();
        break;
    case 'hero':
        blob('#2f4fb8', () => {
            ctx.moveTo(-W2 - 4, B.eyes[1] - 13); ctx.quadraticCurveTo(0, B.eyes[1] - 20, W2 + 4, B.eyes[1] - 13);
            ctx.quadraticCurveTo(W2 + 2, B.eyes[1] + 12, B.eyes[0] - 2, B.eyes[1] + 10);
            ctx.quadraticCurveTo(0, B.eyes[1] + 2, -B.eyes[0] + 2, B.eyes[1] + 10);
            ctx.quadraticCurveTo(-W2 - 2, B.eyes[1] + 12, -W2 - 4, B.eyes[1] - 13);
        });
        for (const sx of [-1, 1])
            blob('#fdf7e8', () => ctx.ellipse(sx * B.eyes[0], B.eyes[1] - 1, B.eyes[2] + 3, B.eyes[2], 0, 0, Math.PI * 2));
        for (const sx of [-1, 1])
            blob('#201814', () => ctx.arc(sx * B.eyes[0], B.eyes[1], B.eyes[2] * .8, 0, Math.PI * 2));
        break;
    case 'skullmask':
        blob('#f4f1e6', () => {
            ctx.moveTo(-W2 - 2, B.eyes[1] - 16); ctx.quadraticCurveTo(0, B.eyes[1] - 26, W2 + 2, B.eyes[1] - 16);
            ctx.quadraticCurveTo(W2 + 4, B.snout[2], 0, B.snout[2] + B.snout[1] * .4);
            ctx.quadraticCurveTo(-W2 - 4, B.snout[2], -W2 - 2, B.eyes[1] - 16);
        });
        for (const sx of [-1, 1])
            blob('#1a1712', () => ctx.ellipse(sx * B.eyes[0], B.eyes[1], B.eyes[2] + 4, B.eyes[2] + 6, 0, 0, Math.PI * 2));
        blob('#1a1712', () => {
            const y = B.snout[2] - B.snout[1] * .5;
            ctx.moveTo(-6, y); ctx.lineTo(0, y - 9); ctx.lineTo(6, y);
        });
        ctx.strokeStyle = '#1a1712'; ctx.lineWidth = 2;
        for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(i * 7, B.snout[2] + 2); ctx.lineTo(i * 7, B.snout[2] + B.snout[1] * .4);
            ctx.stroke();
        }
        break;
    }

    switch (kit.hat) {
    case 'cap':
        blob('#6e6656', () => {
            ctx.moveTo(-W2 - 6, T + 8); ctx.quadraticCurveTo(-W2 - 6, T - 22, 2, T - 21);
            ctx.quadraticCurveTo(W2 + 4, T - 20, W2 + 2, T + 6);
            ctx.quadraticCurveTo(0, T + 13, -W2 - 6, T + 8);
        });
        blob('#5a5344', () => {
            ctx.moveTo(-W2 - 6, T + 8); ctx.quadraticCurveTo(-4, T + 14, W2 - 2, T + 9);
            ctx.quadraticCurveTo(W2 + 14, T + 8, W2 + 18, T + 1);
            ctx.quadraticCurveTo(0, T + 3, -W2 - 5, T + 3);
        });
        break;
    case 'beanie':
        blob('#c2453f', () => {
            ctx.moveTo(-W2 - 5, T + 10); ctx.quadraticCurveTo(-W2 - 6, T - 30, 0, T - 30);
            ctx.quadraticCurveTo(W2 + 6, T - 30, W2 + 5, T + 10);
        });
        blob('#9c332e', () => { ctx.rect(-W2 - 6, T + 2, (W2 + 6) * 2, 10); });
        blob('#f2ece0', () => ctx.arc(0, T - 36, 9, 0, Math.PI * 2));
        break;
    case 'party':
        blob('#d8462f', () => { ctx.moveTo(-20, T + 4); ctx.lineTo(4, T - 54); ctx.lineTo(22, T + 2); });
        blob('#f0d484', () => { ctx.moveTo(-12, T - 12); ctx.lineTo(-6, T - 26); ctx.lineTo(8, T - 10); ctx.lineTo(2, T + 1); });
        blob('#fdf7e8', () => ctx.arc(4, T - 56, 7, 0, Math.PI * 2));
        break;
    case 'chefhat':
        blob('#fdfaf2', () => {
            ctx.moveTo(-W2, T + 8); ctx.lineTo(-W2, T - 12);
            ctx.quadraticCurveTo(-W2 - 12, T - 48, -8, T - 44);
            ctx.quadraticCurveTo(4, T - 62, 16, T - 44);
            ctx.quadraticCurveTo(W2 + 14, T - 46, W2, T - 12);
            ctx.lineTo(W2, T + 8);
        });
        blob('#e6e0d2', () => { ctx.rect(-W2 - 1, T - 2, W2 * 2 + 2, 11); });
        break;
    case 'builder':
        blob('#e8b32a', () => {
            ctx.moveTo(-W2 - 10, T + 6); ctx.quadraticCurveTo(-W2 - 8, T - 34, 0, T - 34);
            ctx.quadraticCurveTo(W2 + 8, T - 34, W2 + 10, T + 6);
        });
        blob('#c5901a', () => {
            ctx.moveTo(-W2 - 16, T + 6); ctx.quadraticCurveTo(0, T + 15, W2 + 16, T + 6);
            ctx.quadraticCurveTo(0, T + 1, -W2 - 16, T + 6);
        });
        blob('#c5901a', () => { ctx.rect(-4, T - 34, 8, 30); });
        break;
    case 'catears':
        for (const sx of [-1, 1]) {
            blob('#2f2a33', () => {
                ctx.moveTo(sx * (W2 - 10), T + 4); ctx.lineTo(sx * (W2 - 4), T - 34);
                ctx.lineTo(sx * (W2 + 14), T - 2);
            });
            blob('#e08a9c', () => {
                ctx.moveTo(sx * (W2 - 7), T + 1); ctx.lineTo(sx * (W2 - 4), T - 24);
                ctx.lineTo(sx * (W2 + 6), T - 4);
            });
        }
        blob('#2f2a33', () => { ctx.rect(-W2 - 2, T - 2, (W2 + 2) * 2, 8); });
        break;
    case 'bunny':
        for (const sx of [-1, 1]) {
            blob('#fdf7e8', () => ctx.ellipse(sx * 15, T - 34, 10, 30, sx * .18, 0, Math.PI * 2));
            blob('#e08a9c', () => ctx.ellipse(sx * 15, T - 34, 5, 22, sx * .18, 0, Math.PI * 2));
        }
        blob('#fdf7e8', () => { ctx.rect(-W2 - 2, T - 4, (W2 + 2) * 2, 9); });
        break;
    case 'muffs':
        blob('#8a5a2c', () => { ctx.rect(-W2 - 2, T - 16, (W2 + 2) * 2, 7); });
        for (const sx of [-1, 1])
            blob('#c2453f', () => ctx.ellipse(sx * (W2 + 8), T + 6, 14, 17, 0, 0, Math.PI * 2));
        break;
    case 'horns':
        for (const sx of [-1, 1]) {
            blob('#a8281f', () => {
                ctx.moveTo(sx * (W2 - 8), T + 4);
                ctx.quadraticCurveTo(sx * (W2 + 6), T - 12, sx * (W2 - 2), T - 32);
                ctx.quadraticCurveTo(sx * (W2 + 10), T - 18, sx * (W2 + 8), T + 2);
            });
        }
        break;
    case 'snaghat':
        blob('#c4472e', () => ctx.ellipse(0, T - 8, W2 + 4, 13, .1, 0, Math.PI * 2));
        blob('#dd6f4c', () => ctx.ellipse(-4, T - 12, W2 - 6, 4, .1, 0, Math.PI * 2));
        blob('#c4472e', () => ctx.ellipse(6, T - 26, W2 - 8, 11, -.2, 0, Math.PI * 2));
        blob('#dd6f4c', () => ctx.ellipse(2, T - 29, W2 - 16, 3.4, -.2, 0, Math.PI * 2));
        break;
    case 'bonehat':
        ctx.save();
        ctx.translate(0, T - 14); ctx.rotate(-.16);
        blob('#efe7d4', () => { ctx.roundRect(-26, -5, 52, 10, 5); });
        for (const sx of [-1, 1]) for (const sy of [-1, 1])
            blob('#efe7d4', () => ctx.arc(sx * 27, sy * 6, 7, 0, Math.PI * 2));
        ctx.restore();
        break;
    case 'topper':
        blob('#1f1c26', () => { ctx.rect(-19, T - 52, 38, 44); });
        blob('#8a2b2b', () => { ctx.rect(-19, T - 18, 38, 10); });
        blob('#1f1c26', () => ctx.ellipse(0, T - 6, W2 + 12, 9, 0, 0, Math.PI * 2));
        break;
    case 'froghood':  case 'bearhood':  case 'capyhood': {
        const skin = kit.hat === 'froghood' ? '#5aa24a'
                   : kit.hat === 'bearhood' ? '#a9743c' : '#9a7a5a';
        const dark = kit.hat === 'froghood' ? '#468039'
                   : kit.hat === 'bearhood' ? '#85592b' : '#7a5f44';
        blob(skin, () => {                                  // the hood round the face
            ctx.moveTo(-W2 - 12, B.eyes[1] + 12);
            ctx.quadraticCurveTo(-W2 - 16, T - 26, 0, T - 26);
            ctx.quadraticCurveTo(W2 + 16, T - 26, W2 + 12, B.eyes[1] + 12);
            ctx.quadraticCurveTo(W2 + 6, B.eyes[1] - 4, W2 - 4, B.eyes[1] - 12);
            ctx.quadraticCurveTo(0, T + 2, -W2 + 4, B.eyes[1] - 12);
            ctx.quadraticCurveTo(-W2 - 6, B.eyes[1] - 4, -W2 - 12, B.eyes[1] + 12);
        });
        if (kit.hat === 'froghood') for (const sx of [-1, 1]) {
            blob(skin, () => ctx.arc(sx * (W2 - 6), T - 22, 15, 0, Math.PI * 2));
            blob('#fdf7e8', () => ctx.arc(sx * (W2 - 6), T - 22, 9, 0, Math.PI * 2));
            blob('#201814', () => ctx.arc(sx * (W2 - 6), T - 22, 4.5, 0, Math.PI * 2));
        } else for (const sx of [-1, 1]) {
            blob(skin, () => ctx.arc(sx * (W2 - 2), T - 20, 14, 0, Math.PI * 2));
            blob(dark, () => ctx.arc(sx * (W2 - 2), T - 20, 7, 0, Math.PI * 2));
        }
        break;
    }
    case 'crown':
        blob('#e8c15a', () => {
            ctx.moveTo(-W2 - 4, T + 6); ctx.lineTo(W2 + 4, T + 6); ctx.lineTo(W2 + 4, T - 10);
            ctx.lineTo(W2 * .5, T - 28); ctx.lineTo(W2 * .25, T - 8);
            ctx.lineTo(0, T - 34); ctx.lineTo(-W2 * .25, T - 8);
            ctx.lineTo(-W2 * .5, T - 28); ctx.lineTo(-W2 - 4, T - 10);
        });
        blob('#a87c22', () => { ctx.rect(-W2 - 4, T + 1, (W2 + 4) * 2, 6); });
        for (const sx of [-1, 0, 1])
            blob('#c2453f', () => ctx.arc(sx * W2 * .55, T + 4, 3.4, 0, Math.PI * 2));
        break;
    }
}

function drawDog(ctx, x, y, k, pose, ms, B, kit) {
    B = B || (cast ? cast.dog : TIERS[2][0]);
    /* What it has on is part of what it is: unless a caller is deliberately
       showing something else (the shop, trying a hat on), the dog wears what
       is in the save. This used to be left undefined, so the only dog in the
       game wearing the shopping was the one in the window. */
    if (kit === undefined) kit = cast ? cast.kit : null;
    const o = pose.open, sq = pose.squash || 0;
    // how it feels about the week, which is the opposite of how he feels
    const glum = pose.mood === 'glum', gone = pose.mood === 'gone';
    ctx.save();
    ctx.translate(x, y - (pose.reach || 0));
    ctx.scale(k * B.k * (1 + sq * .07), k * B.k * (1 - sq * .05));
    ctx.rotate((pose.tilt || 0) + Math.sin(ms / 170) * .04);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const blob = (fill, path) => { ctx.beginPath(); path(); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
    const head = () => {
        ctx.moveTo(-B.skullW, -B.skullH * .4);
        ctx.quadraticCurveTo(-B.skullW + 2, -B.skullH, 0, -B.skullH);
        ctx.quadraticCurveTo(B.skullW - 2, -B.skullH, B.skullW, -B.skullH * .4);
        ctx.quadraticCurveTo(B.jawW + 4, -4, B.jawW, B.jawY);
        ctx.quadraticCurveTo(B.jawW - 6, B.chin - 1, 0, B.chin);
        ctx.quadraticCurveTo(-B.jawW + 6, B.chin - 1, -B.jawW, B.jawY);
        ctx.quadraticCurveTo(-B.jawW - 4, -4, -B.skullW, -B.skullH * .4);
    };

    /* The collar first, so the jowls hang over it. It is drawn here rather
       than with the rest of the kit because it goes on before the head does,
       and the cape goes on before the collar - there is nothing else in the
       wardrobe that has to sit behind the dog. */
    const neck = (kit && kit.collar) || 'spiked';
    const band = fill => {
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 7;
        blob(fill, () => {
            ctx.moveTo(-B.jawW - 2, B.chin - 14); ctx.quadraticCurveTo(0, B.chin + 4, B.jawW + 2, B.chin - 14);
            ctx.lineTo(B.jawW + 2, B.chin + 5); ctx.quadraticCurveTo(0, B.chin + 23, -B.jawW - 2, B.chin + 5);
        });
        ctx.restore();
    };
    const C = B.chin, JW = B.jawW;
    if (neck === 'cape') {
        blob('#8e2a1b', () => {                       // the lining, and then the cape
            ctx.moveTo(-JW + 4, C - 8); ctx.quadraticCurveTo(-JW - 50, C + 34, -JW - 38, C + 84);
            ctx.quadraticCurveTo(0, C + 62, JW + 38, C + 84);
            ctx.quadraticCurveTo(JW + 50, C + 34, JW - 4, C - 8);
        });
        blob('#c23b26', () => {
            ctx.moveTo(-JW + 4, C - 8); ctx.quadraticCurveTo(-JW - 42, C + 32, -JW - 30, C + 74);
            ctx.quadraticCurveTo(0, C + 54, JW + 30, C + 74);
            ctx.quadraticCurveTo(JW + 42, C + 32, JW - 4, C - 8);
        });
    }
    switch (neck) {
    case 'bow':
        band('#2b2333');
        blob('#b03a25', () => {
            ctx.moveTo(0, C + 4);
            ctx.lineTo(-21, C - 7); ctx.lineTo(-21, C + 17); ctx.lineTo(0, C + 4);
            ctx.lineTo(21, C - 7); ctx.lineTo(21, C + 17);
        });
        blob('#7d2417', () => ctx.ellipse(0, C + 5, 5.5, 6.5, 0, 0, Math.PI * 2));
        break;
    case 'scarf':
        band('#a8202a');
        blob('#c8303a', () => {                       // the point of it hanging down
            ctx.moveTo(-19, C + 3); ctx.lineTo(19, C + 3); ctx.lineTo(0, C + 42);
        });
        blob('rgba(255,255,255,.22)', () => {
            ctx.moveTo(-9, C + 8); ctx.lineTo(1, C + 8); ctx.lineTo(-4, C + 24);
        });
        break;
    case 'skullcol':
        band('#1d1a22');
        for (let i = -1; i <= 1; i++) {
            const px = i * (JW * .54), py = C + 3 + (1 - Math.abs(i)) * 3.2;
            blob('#efe7d4', () => ctx.ellipse(px, py, 6, 6.4, 0, 0, Math.PI * 2));
            blob('#efe7d4', () => {
                ctx.moveTo(px - 4.2, py + 3); ctx.lineTo(px + 4.2, py + 3);
                ctx.lineTo(px + 3, py + 9.5); ctx.lineTo(px - 3, py + 9.5);
            });
            for (const sx of [-1, 1])
                blob('#1d1a22', () => ctx.ellipse(px + sx * 2.5, py - .4, 1.8, 2.2, 0, 0, Math.PI * 2));
        }
        break;
    case 'cape':
        band('#2b2333');
        for (const sx of [-1, 1]) {                   // the clasps that hold it on
            blob('#e8c15a', () => ctx.ellipse(sx * (JW * .56), C + 3, 6.5, 7, 0, 0, Math.PI * 2));
            blob('rgba(255,244,205,.5)', () => ctx.ellipse(sx * (JW * .56) - 1.6, C + 1, 2.6, 3, 0, 0, Math.PI * 2));
        }
        break;
    case 'goldcol':
        band('#b0821f');
        blob('#e8c15a', () => {
            ctx.moveTo(-JW - 2, C - 13); ctx.quadraticCurveTo(0, C + 5, JW + 2, C - 13);
            ctx.lineTo(JW + 2, C - 5); ctx.quadraticCurveTo(0, C + 13, -JW - 2, C - 5);
        });
        blob('#c08f2a', () => ctx.ellipse(0, C + 20, 10, 11, 0, 0, Math.PI * 2));
        blob('#f0d478', () => ctx.ellipse(0, C + 18.5, 8.5, 9.5, 0, 0, Math.PI * 2));
        blob('rgba(140,100,20,.5)', () => ctx.ellipse(0, C + 19, 3.4, 4, 0, 0, Math.PI * 2));
        break;
    default:
        band('#2b2333');
        for (let i = -2; i <= 2; i++) {
            const px = i * (JW * .38), py = C + 3 + (2 - Math.abs(i)) * 3.4;
            blob('#dcab3e', () => { ctx.moveTo(px - 6, py + 4); ctx.lineTo(px, py - 8); ctx.lineTo(px + 6, py + 4); });
            blob('rgba(255,244,205,.55)', () => { ctx.moveTo(px - 2.4, py + 2); ctx.lineTo(px, py - 7); ctx.lineTo(px + 1.4, py + 1); });
        }
    }
    // ears: folded over, pricked up, or hanging down the side of the head
    for (const sx of [-1, 1]) {
        if (B.ear === 'prick') {
            blob(B.earCol, () => {
                ctx.moveTo(sx * (B.skullW - 14), -B.skullH * .70);
                ctx.quadraticCurveTo(sx * (B.skullW - 6), -B.skullH - 36, sx * (B.skullW + 4), -B.skullH - 30);
                ctx.quadraticCurveTo(sx * (B.skullW + 9), -B.skullH + 4, sx * (B.skullW - 1), -B.skullH * .48);
            });
            blob('rgba(212,102,124,.45)', () => {
                ctx.moveTo(sx * (B.skullW - 10), -B.skullH * .74);
                ctx.quadraticCurveTo(sx * (B.skullW - 4), -B.skullH - 24, sx * (B.skullW + 1), -B.skullH - 20);
                ctx.quadraticCurveTo(sx * (B.skullW + 4), -B.skullH, sx * (B.skullW - 3), -B.skullH * .56);
            });
        } else if (B.ear === 'drop') {
            blob(B.earCol, () => {
                ctx.moveTo(sx * (B.skullW - 6), -B.skullH * .55);
                ctx.quadraticCurveTo(sx * (B.jawW + 26), -B.skullH * .4, sx * (B.jawW + 20), B.jawY + 10);
                ctx.quadraticCurveTo(sx * (B.jawW + 12), B.chin + 6, sx * (B.jawW - 8), B.jawY);
            });
        } else {
            blob(B.earCol, () => {
                ctx.moveTo(sx * (B.skullW - 4), -B.skullH + 10);
                ctx.quadraticCurveTo(sx * (B.jawW + 6), -B.skullH + 6, sx * (B.jawW + 4), -4);
                ctx.quadraticCurveTo(sx * B.jawW, B.jawY - 6, sx * (B.skullW - 2), B.jawY - 14);
            });
        }
    }
    // the head, and the light down one side of it
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    blob(B.coat, head);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); head(); ctx.clip();
    blob(B.lit, () => { ctx.moveTo(-90, -70); ctx.lineTo(-6, -70); ctx.lineTo(-30, 70); ctx.lineTo(-90, 70); });
    blob(B.shade, () => {
        ctx.moveTo(-90, B.jawY + 2); ctx.quadraticCurveTo(0, B.jawY + 16, 90, B.jawY + 2);
        ctx.lineTo(90, 80); ctx.lineTo(-90, 80);
    });
    if (B.mask) blob(B.mask, () => ctx.ellipse(0, B.snout[2] - 2, B.snout[0] + 7, B.snout[1] + 9, 0, 0, Math.PI * 2));
    if (B.patch) blob(B.patch, () => ctx.ellipse(-B.eyes[0] - 3, B.eyes[1] - 3, 15, 16, .2, 0, Math.PI * 2));
    if (B.points) for (const sx of [-1, 1])
        blob(B.points, () => ctx.ellipse(sx * B.eyes[0], B.eyes[1] - 9, 9, 5, 0, 0, Math.PI * 2));
    ctx.restore();
    // the brow, which is where a dog keeps its opinion
    if (B.brow > .05 || glum) for (const sx of [-1, 1]) {
        const bw = Math.max(.55, B.brow), e = B.eyes[1];
        blob('rgba(58,47,34,' + (.45 + .5 * bw) + ')', () => {
            if (glum) {          // inner ends up, which is the whole of a sulk
                ctx.moveTo(sx * 7, e - 21); ctx.quadraticCurveTo(sx * 21, e - 14, sx * 33, e - 5);
                ctx.quadraticCurveTo(sx * 21, e - 10, sx * 7, e - 16);
            } else {
                ctx.moveTo(sx * 6, e - 12); ctx.quadraticCurveTo(sx * 22, e - 20, sx * 34, e - 6);
                ctx.quadraticCurveTo(sx * 22, e - 14, sx * 7, e - 8);
            }
        });
    }
    // eyes, or what a cartoon puts there instead when it is all over
    for (const sx of [-1, 1]) {
        if (gone) {
            const r = B.eyes[2] * 1.5;
            ctx.strokeStyle = '#201814'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(sx * B.eyes[0] - r, B.eyes[1] - r); ctx.lineTo(sx * B.eyes[0] + r, B.eyes[1] + r);
            ctx.moveTo(sx * B.eyes[0] + r, B.eyes[1] - r); ctx.lineTo(sx * B.eyes[0] - r, B.eyes[1] + r);
            ctx.stroke();
        } else {
            blob('#201814', () => ctx.arc(sx * B.eyes[0], B.eyes[1], B.eyes[2], 0, Math.PI * 2));
            blob('#fdf7e8', () => ctx.arc(sx * B.eyes[0] - B.eyes[2] * .35, B.eyes[1] - B.eyes[2] * .4, B.eyes[2] * .33, 0, Math.PI * 2));
        }
    }
    // the muzzle, the nose, and whatever the mouth is doing
    const [mw, mh, my] = B.snout;
    blob(B.muzzle, () => ctx.ellipse(0, my, mw, mh, 0, 0, Math.PI * 2));
    blob('rgba(0,0,0,.10)', () => ctx.ellipse(0, my + mh * .45, mw * .86, mh * .55, 0, 0, Math.PI * 2));
    blob('#201814', () => {
        ctx.moveTo(-mw * .42, my - mh * .58); ctx.quadraticCurveTo(0, my - mh * 1.05, mw * .42, my - mh * .58);
        ctx.quadraticCurveTo(0, my - mh * .05, -mw * .42, my - mh * .58);
    });
    blob('rgba(255,255,255,.28)', () => ctx.ellipse(-mw * .16, my - mh * .72, mw * .13, mh * .1, -.3, 0, Math.PI * 2));

    const jawY = my + mh * .55;
    if (o > .04) {
        const gape = 3 + 15 * o;
        blob('#4d1c27', () => ctx.ellipse(0, jawY + gape * .5, mw * .72, gape, 0, 0, Math.PI * 2));
        for (const sx of [-1, 1])
            blob('#fdf7e8', () => {
                ctx.moveTo(sx * mw * .42, jawY - 4); ctx.lineTo(sx * mw * .29, jawY + 7);
                ctx.lineTo(sx * mw * .55, jawY + 7);
            });
        blob('#d4667c', () => ctx.ellipse(0, jawY + gape * .95, mw * .38, gape * .55, 0, 0, Math.PI * 2));
    } else if (gone) {
        // mouth open and the tongue out of the side of it, as is traditional
        blob('#4d1c27', () => ctx.ellipse(0, jawY + 5, mw * .5, 9, 0, 0, Math.PI * 2));
        blob('#d4667c', () => {
            ctx.moveTo(mw * .1, jawY + 2); ctx.quadraticCurveTo(mw * .85, jawY + 8, mw * .82, jawY + 26);
            ctx.quadraticCurveTo(mw * .7, jawY + 38, mw * .4, jawY + 30);
            ctx.quadraticCurveTo(mw * .18, jawY + 20, mw * .1, jawY + 2);
        });
    } else if (glum) {
        // mouth shut and turned down, and not a sign of the tongue
        blob('rgba(58,47,34,.85)', () => {
            ctx.moveTo(-mw * .5, jawY + 6); ctx.quadraticCurveTo(0, jawY - 7, mw * .5, jawY + 6);
            ctx.quadraticCurveTo(0, jawY - 1, -mw * .5, jawY + 6);
        });
    } else {
        blob('rgba(58,47,34,.85)', () => {
            ctx.moveTo(-mw * .58, jawY - 4); ctx.quadraticCurveTo(-mw * .29, jawY + 6, 0, jawY - 2);
            ctx.quadraticCurveTo(mw * .29, jawY + 6, mw * .58, jawY - 4);
            ctx.quadraticCurveTo(mw * .29, jawY + 2, 0, jawY - 5);
            ctx.quadraticCurveTo(-mw * .29, jawY + 2, -mw * .58, jawY - 4);
        });
        if (B.brow > .7) for (const sx of [-1, 1])       // the underbite, on those that have one
            blob('#fdf7e8', () => {
                ctx.moveTo(sx * mw * .42, jawY + 5); ctx.lineTo(sx * mw * .32, jawY - 4);
                ctx.lineTo(sx * mw * .55, jawY - 4);
            });
        blob('#d4667c', () => {                           // and the tongue, lolling
            const t = B.tongue;
            ctx.moveTo(mw * .13, jawY + 1); ctx.quadraticCurveTo(mw * .65 * t, jawY + 5, mw * .58 * t, jawY + 20 * t);
            ctx.quadraticCurveTo(mw * .48 * t, jawY + 30 * t, mw * .19, jawY + 26 * t);
            ctx.quadraticCurveTo(0, jawY + 20 * t, mw * .13, jawY + 1);
        });
    }
    drawKit(ctx, B, kit, glum);
    ctx.restore();
}

function drawLoose(ms) {
    for (const l of loose) {
        const e = Math.min(1, (ms - l.t0) / 560);
        const ease = 1 - Math.pow(1 - e, 3);
        const x = l.x + (l.tx - l.x) * ease;
        const y = l.y + (l.ty - l.y) * ease;
        if (e > .55) drawHook(x - 7, y - 16, .62);      // the hook it ends up on
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((1 - ease) * 2.2 + Math.sin((ms - l.t0) / 260) * .05 * ease);
        ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.ellipse(0, 0, 15.5, 29, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#c4472e'; ctx.fill();
        ctx.shadowColor = 'transparent';
        // the shade is a crescent taken off the lit side rather than a second
        // blob dropped on top, which came out looking like a hole in it
        ctx.save();
        ctx.clip();
        ctx.beginPath();
        ctx.ellipse(11, 3, 9, 30, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#8c2b1b'; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-5.5, -3, 4.2, 18, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#dd6f4c'; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-6, -6, 1.8, 11, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#ea8f6e'; ctx.fill();
        ctx.restore();
        ctx.restore();
    }
}

/* ---- the knife ---------------------------------------------------------
   Something has to be doing the cutting. It lies in the corner of the window
   until you put a finger down, then it is at the finger for as long as you
   are dragging - tip on the point of contact, handle trailing back along the
   way you are going, so the blade is pointing where the cut is going rather
   than where it has been. Between swipes it eases back to the corner, which
   is also how you know the game is waiting for you rather than stuck. */
const knife = { x: 0, y: 0, ang: 0, at: 0 };
const restPose = () => [W - 46, H - 58, -2.2];
function knifeStep(dt) {
    let [tx, ty, ta] = restPose();
    let held = 0;
    if (swipe && swipe.length) {
        const n = swipe.length, p = swipe[n - 1], q = swipe[Math.max(0, n - 5)];
        const dx = p[0] - q[0], dy = p[1] - q[1];
        tx = p[0]; ty = p[1]; held = 1;
        if (Math.hypot(dx, dy) > 3) ta = Math.atan2(dy, dx);
        else ta = knife.ang;
    }
    // the shortest way round to the angle it wants, so it never spins the
    // long way when a swipe crosses the back of the compass
    let d = ta - knife.ang;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    if (held) { knife.x = tx; knife.y = ty; }     // the tip is the finger, exactly
    else {
        const ease = 1 - Math.pow(.004, dt);       // and it wanders home afterwards
        knife.x += (tx - knife.x) * ease;
        knife.y += (ty - knife.y) * ease;
    }
    // the angle is eased either way, so a shaky finger does not make it flap
    knife.ang += d * (1 - Math.pow(.000004, dt));
    knife.at += (held - knife.at) * (1 - Math.pow(.0005, dt));
}
/* Four things to cut with, one dealt to the week. They all cut exactly the
   same - a randomised advantage would not be a joke, it would be a cheat -
   so the difference is what it looks and sounds like in your hand. Each is
   drawn tip at the origin with the body trailing back along -x, so whatever
   is on the block this week hangs off the finger the same way. */
function drawKnife(ctx, x, y, ang, k, K) {
    K = K || (cast ? cast.knife : KNIVES[0]);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.scale(k, k);
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 9; ctx.shadowOffsetY = 5;
    const shape = fill => { ctx.fillStyle = fill; ctx.fill(); };
    const rivets = (x1, x2) => {
        for (const rx of [x1, x2]) {
            ctx.beginPath(); ctx.arc(rx, -2, 4, 0, Math.PI * 2); shape('#c59430');
            ctx.beginPath(); ctx.arc(rx - 1, -3, 1.7, 0, Math.PI * 2); shape('#f0d484');
        }
    };
    const handle = (from, to, wood) => {
        ctx.beginPath();
        ctx.moveTo(from, -15);
        ctx.lineTo(to + 11, -13); ctx.quadraticCurveTo(to, -12, to + 1, -2);
        ctx.quadraticCurveTo(to + 2, 9, to + 12, 10); ctx.lineTo(from, 11);
        ctx.closePath(); shape(wood);
        ctx.beginPath();
        ctx.moveTo(from, -15); ctx.lineTo(to + 11, -13);
        ctx.quadraticCurveTo(to + 1, -12, to + 2, -6);
        ctx.lineTo(from, -8);
        ctx.closePath(); shape('#7a4d2c');
    };

    if (K.id === 'cleaver') {
        ctx.beginPath();                                   // a slab with a corner off it
        ctx.moveTo(4, -20); ctx.lineTo(4, 26);
        ctx.quadraticCurveTo(-30, 30, -62, 26);
        ctx.lineTo(-62, -20); ctx.quadraticCurveTo(-30, -24, 4, -20);
        ctx.closePath(); shape('#b9bfc7');
        ctx.shadowColor = 'transparent';
        ctx.save(); ctx.clip();
        ctx.beginPath(); ctx.moveTo(4, -20); ctx.lineTo(-62, -20);
        ctx.lineTo(-62, -6); ctx.lineTo(4, -8); ctx.closePath(); shape('#e9edf1');
        ctx.beginPath(); ctx.moveTo(4, 26); ctx.quadraticCurveTo(-30, 30, -62, 26);
        ctx.lineTo(-62, 19); ctx.quadraticCurveTo(-30, 23, 4, 19); ctx.closePath(); shape('#fbfdff');
        ctx.restore();
        ctx.beginPath(); ctx.arc(-50, -8, 5.5, 0, Math.PI * 2); shape('#3a4048');
        ctx.beginPath();
        ctx.moveTo(-62, -18); ctx.lineTo(-74, -16); ctx.lineTo(-74, 22); ctx.lineTo(-62, 24);
        ctx.closePath(); shape('#8f959d');
        handle(-74, -124, '#5d3a21');
        rivets(-88, -108);
    } else if (K.id === 'boning') {
        ctx.beginPath();                                   // narrow, and curved with use
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-30, 13, -70, 12);
        ctx.lineTo(-70, -2);
        ctx.quadraticCurveTo(-36, -7, 0, 0);
        ctx.closePath(); shape('#b9bfc7');
        ctx.shadowColor = 'transparent';
        ctx.save(); ctx.clip();
        ctx.beginPath(); ctx.moveTo(-70, -2); ctx.quadraticCurveTo(-36, -7, 0, 0);
        ctx.lineTo(-20, 1); ctx.quadraticCurveTo(-42, -2, -70, 2); ctx.closePath(); shape('#e9edf1');
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-30, 13, -70, 12);

/* ---- the man whose shop it is -------------------------------------------

   moustache. There are two of him: the one holding a fistful of notes up
   where everyone can see it, and the one with his hands empty and his
   shoulders down. Which one you get is whether the week beat the best week.

   The head sits high enough to leave room under whatever is on his lip for a
   mouth, which is the whole difference between the two of him. The neck is
   drawn before the coat, or it paints over its own collar. */
function drawButcher(ctx, happy, { cx = 130, cy = 186, k = 1, holds = 'notes', B = null } = {}) {

    ctx.clip();

    ctx.restore();

    // the head

    for (const sx of [-1, 1]) blob(SKIN_D, () => ctx.ellipse(sx * 40, -104, 7, 10, 0, 0, Math.PI * 2));
    if (B.face === 'none') for (const sx of [-1, 1])        // hair, where the hat leaves room
        blob(B.hair, () => ctx.ellipse(sx * 36, -116, 11, 20, sx * .3, 0, Math.PI * 2));
    for (const sx of [-1, 1])                               // ruddy from the cold room
        blob('rgba(211,109,78,.42)', () => ctx.ellipse(sx * 27, -96, 13, 9, 0, 0, Math.PI * 2));
    for (const sx of [-1, 1]) {
        blob('#2a201a', () => ctx.ellipse(sx * 15, -114, 4.4, happy ? 3.4 : 4.8, 0, 0, Math.PI * 2));

            ctx.quadraticCurveTo(44, -172, 42, -144);
            ctx.quadraticCurveTo(0, -136, -46, -142);

            ctx.moveTo(-46, -142); ctx.quadraticCurveTo(-8, -134, 34, -140);
            ctx.quadraticCurveTo(48, -140, 52, -148);

            ctx.quadraticCurveTo(42, -178, 40, -144);
            ctx.quadraticCurveTo(0, -138, -40, -144);
        });
        blob('#e6e0d2', () => {
            ctx.moveTo(-44, -145); ctx.quadraticCurveTo(0, -136, 44, -145);
            ctx.lineTo(44, -152); ctx.quadraticCurveTo(0, -144, -44, -152);

/* ---- showing you how ----------------------------------------------------
   Nobody reads an instruction. So on Monday, while the count is running and
   there is nothing else to do with the screen, a ghost knife walks the cut
   you are meant to make: square across the middle twist, in one stroke, over
   and over until the dog is let off. It stops the moment the round is live,
   because by then you either have it or you have not. */
const DEMO_CYCLE = 1600, DEMO_SWEEP = .5;
const demoOn = () => live && !armed && round === 1 && string && !swipe;
function drawDemo(ms) {
    /* The bottom twist, which frees the bottom sausage - the one nearest the
       dog, and so the one you actually want off first. Demonstrating a cut in
       the middle taught the gesture and nothing about the game. */
    const k = string.n - 2;
    const [cx, cy, tx, ty] = at(string.twists[k]);
    const nx = -ty, ny = tx, L = 78;                   // square across the string
    const ax = cx - nx * L, ay = cy - ny * L;
    const bx = cx + nx * L, by = cy + ny * L;
    const e = ((ms - roundT0) % DEMO_CYCLE) / DEMO_CYCLE;
    const p = Math.min(1, e / DEMO_SWEEP);
    const ease = p * p * (3 - 2 * p);
    const hx = ax + (bx - ax) * ease, hy = ay + (by - ay) * ease;
    const fade = p < 1 ? 1 : Math.max(0, 1 - (e - DEMO_SWEEP) / .28);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = .5;                              // the line it wants, held
    ctx.setLineDash([7, 8]);
    ctx.strokeStyle = '#ffeab0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
    if (p > .02) {                                      // and the bit it has done
        ctx.globalAlpha = .9 * fade;
        ctx.strokeStyle = 'rgba(255,234,176,.3)'; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.strokeStyle = '#fff6dd'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(hx, hy); ctx.stroke();
    }
    if (p < 1) {
        ctx.globalAlpha = .62;
        drawKnife(ctx, hx, hy, Math.atan2(by - ay, bx - ax), .78, cast.knife);
    }
    // and what it is you are watching, next to the thing it is doing rather
    // than down at the bottom of the window where it may as well not be
    ctx.globalAlpha = 1;
    ctx.font = '900 13px Lato, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    const lx = clamp(cx, 70, W - 70), ly = cy + 56;
    ctx.strokeStyle = 'rgba(12,32,24,.9)'; ctx.lineWidth = 5;
    ctx.strokeText('S W I P E   T O   C U T', lx, ly);
    ctx.fillStyle = 'rgba(243,233,214,.9)';
    ctx.fillText('S W I P E   T O   C U T', lx, ly);
    ctx.restore();
}

function draw() {
    const ms = now();
    ctx.clearRect(0, 0, W, H);
    if (!string) return;

    /* The title page draws none of the shop: the shopfront canvas is the
       picture there, and a brass rail with nothing on it over the top of it
       is just one more thing in the way on a phone. */
    if (!showingIntro) {
    drawRail();
    const head = pieces.find(p => p.from === 0);
    if (head) drawHook(at(0)[0] - 7, at(0)[1]);

    for (const p of pieces) drawPiece(p);
    drawLoose(ms);

    // where you cut, flashing white for a moment
    for (let i = cutFx.length - 1; i >= 0; i--) {
        const f = cutFx[i], e = (ms - f.t0) / 340;
        if (e >= 1) { cutFx.splice(i, 1); continue; }
        const [x, y, tx, ty] = at(string.twists[f.k]);
        ctx.save();
        ctx.globalAlpha = 1 - e;
        ctx.strokeStyle = '#ffeab0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        const L = 26 + e * 26;

        ctx.stroke();
        ctx.restore();
