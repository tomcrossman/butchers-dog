<!DOCTYPE html>
<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Butcher's Dog - cut the sausages off the string before the dog gets to them.">

<style>
/* ============================================================
   A BUTCHER'S WINDOW

   Not the squared paper of the other two. Bottle-green glazed tiles, a
   brass rail across the top with the string hanging off it, gold
   signwriting, and no ink outline anywhere: the meat is built from flat
   shapes with the light on one side of them, which is how a sausage is
   drawn and nothing like how a cartoon is.
   ============================================================ */
:root {
    --tile:    #1c4a39;
    --tile-lo: #17402f;
    --grout:   #12362a;
    --shade:   #143d2f;
    --cream:   #f3e9d6;
    --cream-d: #d9cbb0;
    --gold:    #dcab3e;
    --gold-d:  #a87c22;
    --brass:   #c59430;
    --brass-h: #f0d484;
    --meat:    #c4472e;
    --meat-hi: #dd6f4c;
    --meat-lo: #8c2b1b;
    --danger:  #d8462f;
    --good:    #74b985;
    --font:         "Lato", system-ui, -apple-system, sans-serif;
    --font-display: "Alfa Slab One", Georgia, serif;
}
* { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; font-family: var(--font); color: var(--cream); background: var(--tile); }

/* glazed tiles: a grid of grout, a wipe of light down the wall, and the
   corners falling away so it reads as a room rather than a pattern */
#app {
    position: fixed; inset: 0; overflow: hidden; touch-action: none;
    background:
        radial-gradient(130% 80% at 50% 26%, rgba(255,255,255,.10) 0%, transparent 62%),
        radial-gradient(120% 100% at 50% 50%, transparent 46%, rgba(0,0,0,.40) 100%),
        repeating-linear-gradient(0deg, var(--grout) 0 2.5px, transparent 2.5px 48px),
        repeating-linear-gradient(90deg, var(--grout) 0 2.5px, transparent 2.5px 60px),
        linear-gradient(180deg, #235c47 0%, var(--tile) 42%, #163d2f 100%);
}
#pad { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ============================================================
   SIGNWRITING
   Every panel is the same thing: a dark plate, a gold hairline a little
   way inside it, and gold letters. No wonky outlines, no drop shadow.
   ============================================================ */
.sign {
    position: relative;
    background: linear-gradient(180deg, #1a4636, #123327);
    border: 2px solid var(--gold-d); border-radius: 3px;
    box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
}
.sign::after {
    content: ''; position: absolute; inset: 3px; pointer-events: none;
    border: 1px solid rgba(220, 171, 62, .55); border-radius: 1px;
}
#hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 8px;
    padding: 11px 11px; pointer-events: none;
}
.plate {
    display: flex; align-items: center; gap: 7px; padding: 6px 11px 5px;
    font-family: var(--font-display); font-size: 17px; letter-spacing: .01em;
    color: var(--gold); text-shadow: 0 1px 0 rgba(0,0,0,.5);
}
/* every icon in the row is the same size, wherever it hangs - left to itself
   an inline svg with no width takes the whole plate with it */
.sign .ico { width: 13px; height: 13px; fill: var(--gold); flex: none; opacity: .9; }
.plate .of, #till .of {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: 9px; padding-left: 10px; border-left: 1px solid rgba(220,171,62,.4);
    font-size: .82em; opacity: .78;
}
#roundplate.beating { animation: beat .55s ease-in-out infinite alternate; }
#roundplate.beating .of { display: none; }
@keyframes beat { from { box-shadow: 0 2px 0 rgba(0,0,0,.35); }
                  to   { box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 16px rgba(220,171,62,.6); } }
#till {
    flex: 1; min-width: 96px; display: flex; align-items: center; justify-content: center;
    gap: 0; padding: 6px 10px 5px; white-space: nowrap;
    font-family: var(--font-display); font-size: 17px; color: var(--gold);
    text-shadow: 0 1px 0 rgba(0,0,0,.5);
}

#roundplate.hurt { animation: hurt .5s ease-out both; }
@keyframes hurt { 0%, 100% { box-shadow: 0 2px 0 rgba(0,0,0,.35); }
                  30% { box-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 20px rgba(216,70,47,.9); } }
#shopfront { width: min(84vw, 330px); height: auto; margin-bottom: 4px;
             animation: butcherIn .6s cubic-bezier(.2, 1.5, .4, 1) both; }
/* the week's takings, day by day */
#ledger { width: 100%; border-collapse: collapse; margin: 4px 0 10px;
          font-size: 13px; font-weight: 700; }
#ledger td { padding: 3px 0; border-bottom: 1px solid rgba(42,33,24,.14); }
#ledger td.d { text-align: left; letter-spacing: .1em; text-transform: uppercase;
               font-size: 11px; opacity: .7; }
#ledger td.w { text-align: left; font-weight: 400; opacity: .5; font-size: 11px; }
#ledger td.m { text-align: right; font-family: var(--font-display); font-size: 15px; }
#ledger tr.shut td { opacity: .35; }
#ledger tr.best td.m { color: #1f7a3f; }
/* the week that ended with a stone in it has no ledger worth printing */
#card.grave #ledger { display: none; }
#card.grave #score { color: #5a564e; }
#card.grave #ribbon { background: #4b4842; color: #efe7d4; }
#mute {
    pointer-events: auto; cursor: pointer; padding: 7px 8px 4px; line-height: 0;
    background: linear-gradient(180deg, #1a4636, #123327);
    border: 2px solid var(--gold-d); border-radius: 3px;
}
#mute:active { transform: translateY(1px); }
#mute .off { display: none; }
#mute.muted .on { display: none; }
#mute.muted .off { display: inline; }

#prompt {
    position: absolute; left: 0; right: 0; bottom: 6%; z-index: 2;
    text-align: center; pointer-events: none; padding: 0 22px;
    font-family: var(--font); font-weight: 900; text-transform: uppercase;
    font-size: clamp(12px, 3.4vw, 15px); letter-spacing: .18em;
    color: var(--cream); opacity: .5; transition: opacity .25s;
}
#prompt.gone { opacity: 0; }

#banner {
    position: absolute; left: 0; right: 0; top: 28%; z-index: 4;
    text-align: center; pointer-events: none; opacity: 0;
    font-family: var(--font-display); color: var(--gold);
    text-shadow: 0 3px 0 rgba(0,0,0,.45);
}
#banner .who {
    display: block; font-family: var(--font); font-weight: 900; font-size: 13px;
    text-transform: uppercase; letter-spacing: .16em; color: var(--cream);
    opacity: .68; margin-bottom: 6px;
}
#banner .r { display: block; font-size: clamp(46px, 16vw, 78px); line-height: 1; letter-spacing: .01em; }
#banner .r.go-word { font-size: clamp(38px, 13vw, 62px); color: #8fd6a2; }
#banner.go { animation: bannerGo .62s ease-out both; }
@keyframes bannerGo {
    0%   { transform: scale(1.4); opacity: 0; }
    16%  { transform: scale(1); opacity: 1; }
    72%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(.92); opacity: 0; }
}

/* The day's takings, over the middle of the window rather than the bottom of
   it - the dog finishes wherever it got to, and the bottom of the string is
   exactly where it usually is. On its own plate, so it reads over whatever
   is behind it. */
#tally {
    position: absolute; left: 50%; top: 32%; z-index: 9;
    transform: translate(-50%, -50%);
    text-align: center; pointer-events: none; display: none;
    width: max-content; max-width: min(80vw, 290px); padding: 13px 22px 11px;
    background: rgba(12, 34, 26, .88);
    border: 2px solid var(--gold-d); border-radius: 3px;
    box-shadow: 0 4px 0 rgba(0,0,0,.4);
}
#tally.on { display: block; animation: tallyIn .3s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes tallyIn { from { transform: translate(-50%, -44%) scale(.92); opacity: 0; }
                     to   { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
#tally .n {
    display: block; font-family: var(--font-display); font-size: clamp(40px, 13vw, 58px);
    line-height: 1; color: var(--gold); text-shadow: 0 3px 0 rgba(0,0,0,.45);
}
#tally .l { display: block; font-family: var(--font); font-weight: 900; font-size: 15px;
            text-transform: uppercase; letter-spacing: .08em; margin-top: 3px; line-height: 1.25; }
#tally .b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em;
            text-transform: uppercase; opacity: .5; margin-top: 5px; }

/* ---- the front door ---------------------------------------------------
   A phone browser will not let a freshly loaded page make a sound on the
   first touch it receives, so the first press has to be spent on something
   that is not the game. Pressing Open is what opens the audio. */
#intro {
    position: absolute; inset: 0; z-index: 12;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 22px 6%; text-align: center;
    background: linear-gradient(transparent 4%, rgba(18,51,39,.85) 46%, #123327 62%);
    animation: introIn .5s ease-out both;
}
@keyframes introIn { from { opacity: 0; } to { opacity: 1; } }
#intro[hidden] { display: none; }
body.waiting #hud { display: none; }
#intro h1 {
    margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; color: var(--gold);
    font-size: clamp(38px, 13.5vw, 60px); line-height: .98; letter-spacing: .01em;
    text-shadow: 0 4px 0 rgba(0,0,0,.45);
}
#intro .rule {
    width: 132px; height: 2px; margin: 10px 0 10px;
    background: linear-gradient(90deg, transparent, var(--gold-d), transparent);
}
#intro p { margin: 0; max-width: 330px; font-size: 13px; font-weight: 700;
           line-height: 1.6; letter-spacing: .04em; opacity: .74; }
#intro .btn { margin-top: 16px; width: 100%; max-width: 236px; }

/* ============================================================
   THE TICKET
   ============================================================ */
/* The end of the day takes the whole window. Everything else is cleared away
   and the man whose shop it is stands there with the takings, which says more
   about how it went than the number does. */
#card {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 20px 18px; pointer-events: auto; overflow-y: auto;
    background:
        radial-gradient(120% 80% at 50% 34%, rgba(255,255,255,.07) 0%, transparent 60%),
        radial-gradient(120% 100% at 50% 50%, transparent 40%, rgba(0,0,0,.55) 100%),
        repeating-linear-gradient(0deg, var(--grout) 0 2.5px, transparent 2.5px 48px),
        repeating-linear-gradient(90deg, var(--grout) 0 2.5px, transparent 2.5px 60px),
        linear-gradient(180deg, #1c4a39 0%, #16402f 60%, #102b21 100%);
    animation: introIn .34s ease-out both;
}
#card[hidden] { display: none; }
#butcher {
    width: min(74vw, 292px); height: auto; flex: none;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.45));
    animation: butcherIn .55s cubic-bezier(.2, 1.5, .4, 1) both;
}
@keyframes butcherIn { from { transform: translateY(26px) scale(.9); opacity: 0; }
                       to   { transform: none; opacity: 1; } }
#card .inner {
    position: relative; flex: none; pointer-events: auto;
    animation: sheetIn .34s cubic-bezier(.2, 1.3, .4, 1) .12s both;
    width: 100%; max-width: 316px; padding: 22px 20px 20px;
    background: linear-gradient(180deg, #faf4e6, #eadfc6);
    border: 3px solid #2a2118; border-radius: 4px;
    box-shadow: 0 10px 0 rgba(0,0,0,.30); text-align: center; color: #2a2118;
}
#card .inner::after {
    content: ''; position: absolute; inset: 6px; pointer-events: none;
    border: 1.5px solid rgba(42,33,24,.35);
}
@keyframes sheetIn { from { transform: translateY(26px); opacity: 0; }
                     to   { transform: translateY(0); opacity: 1; } }
#ribbon {
    position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 14px; letter-spacing: .16em; white-space: nowrap;
    padding: 5px 18px 4px; background: var(--danger); color: #fff5e6;
    border: 2.5px solid #2a2118; border-radius: 2px; z-index: 3;
    animation: ribbonIn .5s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes ribbonIn { from { transform: translateX(-50%) scale(.6); opacity: 0; }
                      to   { transform: translateX(-50%) scale(1); opacity: 1; } }
#card.record #ribbon { background: var(--gold); color: #2a2118; }
#card #score {
    display: block; font-family: var(--font-display); font-size: 48px; line-height: 1;
    color: #b03a25; margin: 8px 0 0;
}
#card.record #score { color: #a8791e; }
/* the caption sits under the number rather than beside it - "for the week"
   alongside a five-figure total wraps, and wraps badly */
#score .pc { display: block; font-size: .24em; letter-spacing: .16em;
             text-transform: uppercase; opacity: .6; margin-top: 4px; }
#rating { margin: 6px 0 0; font-family: var(--font); font-weight: 900; font-size: 17px;
          text-transform: uppercase; letter-spacing: .06em; }
#pass { margin: 7px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .12em;
        text-transform: uppercase; opacity: .55; }
.btn {
    margin-top: 16px; width: 100%;
    font-family: var(--font-display); font-size: 17px; font-weight: 400; letter-spacing: .04em;
    padding: 13px; color: #2a2118;
    background: linear-gradient(180deg, #e8be55, var(--brass));
    border: 2.5px solid #2a2118; border-radius: 3px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35); cursor: pointer;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }

#app.shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake {
    10%, 90% { transform: translate3d(-3px, 1px, 0); }
    20%, 80% { transform: translate3d(7px, -2px, 0); }
    30%, 50%, 70% { transform: translate3d(-11px, 2px, 0); }
    40%, 60% { transform: translate3d(11px, -1px, 0); }
}
#version { position: absolute; bottom: 7px; right: 10px; z-index: 3;
           font-size: 9px; font-weight: 700; letter-spacing: .14em;
           text-transform: uppercase; color: var(--cream); opacity: .22; }

@media (max-height: 700px) {
    #butcher { width: min(56vw, 216px); }
    #card #score { font-size: 40px; }
    #ledger { font-size: 12px; margin: 2px 0 6px; }
}
@media (max-width: 400px) {
    #hud { padding: 9px 9px; gap: 6px; }
    .plate { font-size: 14px; padding: 5px 8px 4px; }
    .plate .ico { width: 12px; height: 12px; }
    #quota { padding: 5px 7px; }
    #mute { padding: 6px 7px 3px; }
    #mute svg { width: 18px; height: 18px; }
}
</style>
</head>

<body class="waiting">

<script>
const APP_VERSION = 'v11';
document.getElementById('version').textContent = `Butcher's Dog ${APP_VERSION}`;

/* ============================================================
   SOUND
   All of it synthesised - there is not a recording in the project. The
   unlock dance below is the one Perfect Circle paid for in full: a phone
   browser will not open an audio session on a page's first touch, so the
   Play button spends it, and everything is scheduled against a clock that
   has been seen to move rather than one that claims to be running.
   ============================================================ */
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null, master = null, soundOn = true;
const soundKey = 'bd-sound';
try { soundOn = localStorage.getItem(soundKey) !== 'off'; } catch (e) { /* private mode */ }

function audioNow() {
    if (!audioCtx) {
        audioCtx = new AC();
        master = audioCtx.createGain();
        master.gain.value = .7;
        master.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx.currentTime;
}
function tone(t0, { freq, to, dur = .18, type = 'triangle', vol = .2, at = 0 }) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = t0 + at;
    o.type = type;
    o.frequency.setValueAtTime(freq, s);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), s + dur);
    g.gain.setValueAtTime(.0001, s);
    g.gain.exponentialRampToValueAtTime(vol, s + .012);
    g.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(g); g.connect(master);
    o.start(s); o.stop(s + dur + .02);
}
const LEAD = .025;
let clockGoing = false;
function whenRunning(fn) {
    try {
        audioNow();
        const go = () => { clockGoing = true; fn(audioCtx.currentTime + LEAD); };
        if (clockGoing || audioCtx.currentTime > 0) return go();
        audioCtx.resume().catch(() => {});
        let tries = 0;
        const waitForTheClock = () => {
            if (audioCtx.currentTime > 0) return go();
            if (tries === 30) startSession();
            if (++tries > 90) return;
            requestAnimationFrame(waitForTheClock);
        };
        waitForTheClock();
    } catch (e) { /* no audio here, never mind */ }
}
const safely = fn => { if (!soundOn) return; whenRunning(fn); };
let noiseBuf = null;
function noise() {
    if (!noiseBuf) {
        const len = Math.floor(audioCtx.sampleRate * .6);
        noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
}
function hiss(t0, { hp = 1200, lp = 16000, dur = .12, vol = .3, at = 0 }) {
    const n = audioCtx.createBufferSource(), h = audioCtx.createBiquadFilter(),
          l = audioCtx.createBiquadFilter(), g = audioCtx.createGain(), s = t0 + at;
    n.buffer = noise();
    h.type = 'highpass'; h.frequency.value = hp;
    l.type = 'lowpass';  l.frequency.value = lp;

/* One dog a week, and it is at the door every morning. Which one is dealt
   with the butcher and the knife, so a week has a cast rather than a set of
   settings, and the dog you spend six days getting past is a particular
   animal with a name rather than a difficulty setting.

   Its breed is looks, near enough. A dachshund week and a Great Dane week
   have to be worth comparing, now that the till is the only score, so the
   twelve of them are pulled into a narrow band of speed - the bigger ones a
   shade quicker and no more than that. What escalates is the week: a longer
   string and a quicker dog every morning, and a dog that has been fed
   getting keener with it. */
let cast = null;
function deal() {
    const tier = (Math.random() * TIERS.length) | 0;
    cast = {
        butcher: pick(BUTCHERS),
        knife: pick(KNIVES),
        dog: { ...pick(TIERS[tier]), dog: pick(DOG_NAMES), speed: .94 + tier * .025 },
    };
}
const breedFor = () => cast.dog;

/* Drawn on the same terms as the meat: no outline, just shapes with the light
   on one side. `pose` is where it is in a bite - how far the jaw is open, how
   far it has reached up the string, and the squash on the moment of contact. */
function drawDog(ctx, x, y, k, pose, ms, B) {
    B = B || (cast ? cast.dog : TIERS[2][0]);
    const o = pose.open, sq = pose.squash || 0;
    // how it feels about the week, which is the opposite of how he feels
    const glum = pose.mood === 'glum';
    ctx.save();
    ctx.translate(x, y - (pose.reach || 0));
    ctx.scale(k * B.k * (1 + sq * .07), k * B.k * (1 - sq * .05));
    ctx.rotate((pose.tilt || 0) + Math.sin(ms / 170) * .04);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const blob = (fill, path) => { ctx.beginPath(); path(); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
    const head = () => {
        ctx.moveTo(-B.skullW, -B.skullH * .4);
        ctx.quadraticCurveTo(-B.skullW + 2, -B.skullH, 0, -B.skullH);
        ctx.quadraticCurveTo(B.skullW - 2, -B.skullH, B.skullW, -B.skullH * .4);
        ctx.quadraticCurveTo(B.jawW + 4, -4, B.jawW, B.jawY);
        ctx.quadraticCurveTo(B.jawW - 6, B.chin - 1, 0, B.chin);
        ctx.quadraticCurveTo(-B.jawW + 6, B.chin - 1, -B.jawW, B.jawY);
        ctx.quadraticCurveTo(-B.jawW - 4, -4, -B.skullW, -B.skullH * .4);
    };

    // the collar first, so the jowls hang over it
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 7;
    blob('#2b2333', () => {
        ctx.moveTo(-B.jawW - 2, B.chin - 14); ctx.quadraticCurveTo(0, B.chin + 4, B.jawW + 2, B.chin - 14);
        ctx.lineTo(B.jawW + 2, B.chin + 5); ctx.quadraticCurveTo(0, B.chin + 23, -B.jawW - 2, B.chin + 5);
    });
    ctx.restore();
    for (let i = -2; i <= 2; i++) {
        const px = i * (B.jawW * .38), py = B.chin + 3 + (2 - Math.abs(i)) * 3.4;
        blob('#dcab3e', () => { ctx.moveTo(px - 6, py + 4); ctx.lineTo(px, py - 8); ctx.lineTo(px + 6, py + 4); });
        blob('rgba(255,244,205,.55)', () => { ctx.moveTo(px - 2.4, py + 2); ctx.lineTo(px, py - 7); ctx.lineTo(px + 1.4, py + 1); });
    }
    // ears: folded over, pricked up, or hanging down the side of the head
    for (const sx of [-1, 1]) {
        if (B.ear === 'prick') {
            blob(B.earCol, () => {
                ctx.moveTo(sx * (B.skullW - 14), -B.skullH * .70);
                ctx.quadraticCurveTo(sx * (B.skullW - 6), -B.skullH - 36, sx * (B.skullW + 4), -B.skullH - 30);
                ctx.quadraticCurveTo(sx * (B.skullW + 9), -B.skullH + 4, sx * (B.skullW - 1), -B.skullH * .48);
            });
            blob('rgba(212,102,124,.45)', () => {
                ctx.moveTo(sx * (B.skullW - 10), -B.skullH * .74);
                ctx.quadraticCurveTo(sx * (B.skullW - 4), -B.skullH - 24, sx * (B.skullW + 1), -B.skullH - 20);
                ctx.quadraticCurveTo(sx * (B.skullW + 4), -B.skullH, sx * (B.skullW - 3), -B.skullH * .56);
            });
        } else if (B.ear === 'drop') {
            blob(B.earCol, () => {
                ctx.moveTo(sx * (B.skullW - 6), -B.skullH * .55);
                ctx.quadraticCurveTo(sx * (B.jawW + 26), -B.skullH * .4, sx * (B.jawW + 20), B.jawY + 10);
                ctx.quadraticCurveTo(sx * (B.jawW + 12), B.chin + 6, sx * (B.jawW - 8), B.jawY);
            });
        } else {
            blob(B.earCol, () => {
                ctx.moveTo(sx * (B.skullW - 4), -B.skullH + 10);
                ctx.quadraticCurveTo(sx * (B.jawW + 6), -B.skullH + 6, sx * (B.jawW + 4), -4);
                ctx.quadraticCurveTo(sx * B.jawW, B.jawY - 6, sx * (B.skullW - 2), B.jawY - 14);
            });
        }
    }
    // the head, and the light down one side of it
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    blob(B.coat, head);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); head(); ctx.clip();
    blob(B.lit, () => { ctx.moveTo(-90, -70); ctx.lineTo(-6, -70); ctx.lineTo(-30, 70); ctx.lineTo(-90, 70); });
    blob(B.shade, () => {
        ctx.moveTo(-90, B.jawY + 2); ctx.quadraticCurveTo(0, B.jawY + 16, 90, B.jawY + 2);
        ctx.lineTo(90, 80); ctx.lineTo(-90, 80);
    });
    if (B.mask) blob(B.mask, () => ctx.ellipse(0, B.snout[2] - 2, B.snout[0] + 7, B.snout[1] + 9, 0, 0, Math.PI * 2));
    if (B.patch) blob(B.patch, () => ctx.ellipse(-B.eyes[0] - 3, B.eyes[1] - 3, 15, 16, .2, 0, Math.PI * 2));
    if (B.points) for (const sx of [-1, 1])
        blob(B.points, () => ctx.ellipse(sx * B.eyes[0], B.eyes[1] - 9, 9, 5, 0, 0, Math.PI * 2));
    ctx.restore();
    // the brow, which is where a dog keeps its opinion
    if (B.brow > .05 || glum) for (const sx of [-1, 1]) {
        const bw = Math.max(.55, B.brow), e = B.eyes[1];
        blob('rgba(58,47,34,' + (.45 + .5 * bw) + ')', () => {
            if (glum) {          // inner ends up, which is the whole of a sulk
                ctx.moveTo(sx * 7, e - 21); ctx.quadraticCurveTo(sx * 21, e - 14, sx * 33, e - 5);
                ctx.quadraticCurveTo(sx * 21, e - 10, sx * 7, e - 16);
            } else {
                ctx.moveTo(sx * 6, e - 12); ctx.quadraticCurveTo(sx * 22, e - 20, sx * 34, e - 6);
                ctx.quadraticCurveTo(sx * 22, e - 14, sx * 7, e - 8);
            }
        });
    }
    // eyes
    for (const sx of [-1, 1]) {
        blob('#201814', () => ctx.arc(sx * B.eyes[0], B.eyes[1], B.eyes[2], 0, Math.PI * 2));
        blob('#fdf7e8', () => ctx.arc(sx * B.eyes[0] - B.eyes[2] * .35, B.eyes[1] - B.eyes[2] * .4, B.eyes[2] * .33, 0, Math.PI * 2));
    }
    // the muzzle, the nose, and whatever the mouth is doing
    const [mw, mh, my] = B.snout;
    blob(B.muzzle, () => ctx.ellipse(0, my, mw, mh, 0, 0, Math.PI * 2));
    blob('rgba(0,0,0,.10)', () => ctx.ellipse(0, my + mh * .45, mw * .86, mh * .55, 0, 0, Math.PI * 2));
    blob('#201814', () => {
        ctx.moveTo(-mw * .42, my - mh * .58); ctx.quadraticCurveTo(0, my - mh * 1.05, mw * .42, my - mh * .58);
        ctx.quadraticCurveTo(0, my - mh * .05, -mw * .42, my - mh * .58);
    });
    blob('rgba(255,255,255,.28)', () => ctx.ellipse(-mw * .16, my - mh * .72, mw * .13, mh * .1, -.3, 0, Math.PI * 2));

    const jawY = my + mh * .55;
    if (o > .04) {
        const gape = 3 + 15 * o;
        blob('#4d1c27', () => ctx.ellipse(0, jawY + gape * .5, mw * .72, gape, 0, 0, Math.PI * 2));
        for (const sx of [-1, 1])
            blob('#fdf7e8', () => {
                ctx.moveTo(sx * mw * .42, jawY - 4); ctx.lineTo(sx * mw * .29, jawY + 7);
                ctx.lineTo(sx * mw * .55, jawY + 7);
            });
        blob('#d4667c', () => ctx.ellipse(0, jawY + gape * .95, mw * .38, gape * .55, 0, 0, Math.PI * 2));
    } else if (glum) {
        // mouth shut and turned down, and not a sign of the tongue
        blob('rgba(58,47,34,.85)', () => {
            ctx.moveTo(-mw * .5, jawY + 6); ctx.quadraticCurveTo(0, jawY - 7, mw * .5, jawY + 6);
            ctx.quadraticCurveTo(0, jawY - 1, -mw * .5, jawY + 6);
        });
    } else {
        blob('rgba(58,47,34,.85)', () => {
            ctx.moveTo(-mw * .58, jawY - 4); ctx.quadraticCurveTo(-mw * .29, jawY + 6, 0, jawY - 2);
            ctx.quadraticCurveTo(mw * .29, jawY + 6, mw * .58, jawY - 4);
            ctx.quadraticCurveTo(mw * .29, jawY + 2, 0, jawY - 5);
            ctx.quadraticCurveTo(-mw * .29, jawY + 2, -mw * .58, jawY - 4);
        });
        if (B.brow > .7) for (const sx of [-1, 1])       // the underbite, on those that have one
            blob('#fdf7e8', () => {
                ctx.moveTo(sx * mw * .42, jawY + 5); ctx.lineTo(sx * mw * .32, jawY - 4);
                ctx.lineTo(sx * mw * .55, jawY - 4);
            });
        blob('#d4667c', () => {                           // and the tongue, lolling
            const t = B.tongue;
            ctx.moveTo(mw * .13, jawY + 1); ctx.quadraticCurveTo(mw * .65 * t, jawY + 5, mw * .58 * t, jawY + 20 * t);
            ctx.quadraticCurveTo(mw * .48 * t, jawY + 30 * t, mw * .19, jawY + 26 * t);
            ctx.quadraticCurveTo(0, jawY + 20 * t, mw * .13, jawY + 1);
        });
    }
    ctx.restore();
}

function drawLoose(ms) {
    for (const l of loose) {
        const e = Math.min(1, (ms - l.t0) / 560);
        const ease = 1 - Math.pow(1 - e, 3);
        const x = l.x + (l.tx - l.x) * ease;
        const y = l.y + (l.ty - l.y) * ease;
        if (e > .55) drawHook(x - 7, y - 16, .62);      // the hook it ends up on
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((1 - ease) * 2.2 + Math.sin((ms - l.t0) / 260) * .05 * ease);
        ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.ellipse(0, 0, 15.5, 29, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#c4472e'; ctx.fill();
        ctx.shadowColor = 'transparent';
        // the shade is a crescent taken off the lit side rather than a second
        // blob dropped on top, which came out looking like a hole in it
        ctx.save();
        ctx.clip();
        ctx.beginPath();
        ctx.ellipse(11, 3, 9, 30, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#8c2b1b'; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-5.5, -3, 4.2, 18, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#dd6f4c'; ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-6, -6, 1.8, 11, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#ea8f6e'; ctx.fill();
        ctx.restore();
        ctx.restore();
    }
}

/* ---- the knife ---------------------------------------------------------
   Something has to be doing the cutting. It lies in the corner of the window
   until you put a finger down, then it is at the finger for as long as you
   are dragging - tip on the point of contact, handle trailing back along the
   way you are going, so the blade is pointing where the cut is going rather
   than where it has been. Between swipes it eases back to the corner, which
   is also how you know the game is waiting for you rather than stuck. */
const knife = { x: 0, y: 0, ang: 0, at: 0 };
const restPose = () => [W - 46, H - 58, -2.2];
function knifeStep(dt) {
    let [tx, ty, ta] = restPose();
    let held = 0;
    if (swipe && swipe.length) {
        const n = swipe.length, p = swipe[n - 1], q = swipe[Math.max(0, n - 5)];
        const dx = p[0] - q[0], dy = p[1] - q[1];
        tx = p[0]; ty = p[1]; held = 1;
        if (Math.hypot(dx, dy) > 3) ta = Math.atan2(dy, dx);
        else ta = knife.ang;
    }
    // the shortest way round to the angle it wants, so it never spins the
    // long way when a swipe crosses the back of the compass
    let d = ta - knife.ang;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    if (held) { knife.x = tx; knife.y = ty; }     // the tip is the finger, exactly
    else {
        const ease = 1 - Math.pow(.004, dt);       // and it wanders home afterwards
        knife.x += (tx - knife.x) * ease;
        knife.y += (ty - knife.y) * ease;
    }
    // the angle is eased either way, so a shaky finger does not make it flap
    knife.ang += d * (1 - Math.pow(.000004, dt));
    knife.at += (held - knife.at) * (1 - Math.pow(.0005, dt));
}
/* Four things to cut with, one dealt to the week. They all cut exactly the
   same - a randomised advantage would not be a joke, it would be a cheat -
   so the difference is what it looks and sounds like in your hand. Each is
   drawn tip at the origin with the body trailing back along -x, so whatever
   is on the block this week hangs off the finger the same way. */
function drawKnife(ctx, x, y, ang, k, K) {
    K = K || (cast ? cast.knife : KNIVES[0]);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.scale(k, k);
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 9; ctx.shadowOffsetY = 5;
    const shape = fill => { ctx.fillStyle = fill; ctx.fill(); };
    const rivets = (x1, x2) => {
        for (const rx of [x1, x2]) {
            ctx.beginPath(); ctx.arc(rx, -2, 4, 0, Math.PI * 2); shape('#c59430');
            ctx.beginPath(); ctx.arc(rx - 1, -3, 1.7, 0, Math.PI * 2); shape('#f0d484');
        }
    };
    const handle = (from, to, wood) => {
        ctx.beginPath();
        ctx.moveTo(from, -15);
        ctx.lineTo(to + 11, -13); ctx.quadraticCurveTo(to, -12, to + 1, -2);
        ctx.quadraticCurveTo(to + 2, 9, to + 12, 10); ctx.lineTo(from, 11);
        ctx.closePath(); shape(wood);
        ctx.beginPath();

        ctx.beginPath();

        ctx.lineTo(-20, 1); ctx.quadraticCurveTo(-42, -2, -70, 2); ctx.closePath(); shape('#e9edf1');
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-30, 13, -70, 12);

/* ---- the man whose shop it is -------------------------------------------
   White coat, striped apron, a hat of some sort and, more often than not, a
   moustache. There are two of him: the one holding a fistful of notes up
   where everyone can see it, and the one with his hands empty and his
   shoulders down. Which one you get is whether the week beat the best week.

   The head sits high enough to leave room under whatever is on his lip for a
   mouth, which is the whole difference between the two of him. The neck is
   drawn before the coat, or it paints over its own collar. */
function drawButcher(ctx, happy, { cx = 130, cy = 186, k = 1, holds = 'notes', B = null } = {}) {
    B = B || (cast ? cast.butcher : BUTCHERS[0]);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(k, k);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const blob = (fill, path) => { ctx.beginPath(); path(); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
    const SKIN = B.skin, SKIN_D = B.skinD, COAT = '#f7f3ea', COAT_D = '#e3dccc';
    const droop = happy ? 0 : 1;
    const up = happy || holds === 'knife';

    for (const sx of [-1, 1]) {
        const raised = up && sx > 0;
        blob(COAT_D, () => {
            ctx.moveTo(sx * 40, -44);
            if (raised) {
                ctx.quadraticCurveTo(sx * 88, -58, sx * 76, -116);
                ctx.lineTo(sx * 50, -120);
                ctx.quadraticCurveTo(sx * 60, -66, sx * 22, -38);
            } else {
                ctx.quadraticCurveTo(sx * 70, -10, sx * 66, 46);
                ctx.lineTo(sx * 40, 46);
                ctx.quadraticCurveTo(sx * 38, -8, sx * 22, -38);
            }
        });
        const hx = raised ? sx * 63 : sx * 53, hy = raised ? -122 : 52;
        if (raised && holds === 'knife') {                 // the tools of the trade
            ctx.save();
            ctx.translate(hx - 2, hy - 2);
            ctx.rotate(-1.45);
            drawKnife(ctx, 0, 0, 0, .80, cast ? cast.knife : KNIVES[0]);
            ctx.restore();
        }
        blob(SKIN, () => ctx.ellipse(hx, hy, 13, 11, 0, 0, Math.PI * 2));
        if (raised && holds === 'notes') for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.translate(hx + 2, hy - 8);
            ctx.rotate(-.5 + i * .27);
            blob('#cfe3c4', () => { ctx.rect(-8, -34, 22, 32); });
            blob('#9dc48c', () => { ctx.rect(-8, -34, 22, 5); });
            blob('#6f9c60', () => ctx.ellipse(3, -18, 5, 6, 0, 0, Math.PI * 2));
            ctx.restore();
        }
    }
    blob(SKIN_D, () => { ctx.rect(-13, -76, 26, 30); });   // the neck, under the collar
    blob(COAT, () => {
        ctx.moveTo(-40, -56);
        ctx.quadraticCurveTo(-52, -48, -54, 20);
        ctx.lineTo(-56, 96); ctx.lineTo(56, 96);
        ctx.quadraticCurveTo(54, 20, 52, -48);
        ctx.quadraticCurveTo(40, -56, 0, -54);
    });
    ctx.save();                                            // the apron over it
    ctx.beginPath();
    ctx.moveTo(-28, -50); ctx.lineTo(28, -50);
    ctx.quadraticCurveTo(34, 10, 40, 96); ctx.lineTo(-40, 96);
    ctx.quadraticCurveTo(-34, 10, -28, -50);
    ctx.closePath();
    ctx.fillStyle = '#f7f3ea'; ctx.fill();
    ctx.clip();
    ctx.fillStyle = B.apron;
    for (let x = -46; x < 46; x += 15) ctx.fillRect(x, -60, 7, 170);
    ctx.restore();
    blob('rgba(0,0,0,.10)', () => { ctx.rect(-40, 88, 80, 8); });

    // the head
    blob(SKIN, () => ctx.ellipse(0, -106, 41, 48, 0, 0, Math.PI * 2));
    for (const sx of [-1, 1]) blob(SKIN_D, () => ctx.ellipse(sx * 40, -104, 7, 10, 0, 0, Math.PI * 2));
    if (B.face === 'none') for (const sx of [-1, 1])        // hair, where the hat leaves room
        blob(B.hair, () => ctx.ellipse(sx * 36, -116, 11, 20, sx * .3, 0, Math.PI * 2));
    for (const sx of [-1, 1])                               // ruddy from the cold room
        blob('rgba(211,109,78,.42)', () => ctx.ellipse(sx * 27, -96, 13, 9, 0, 0, Math.PI * 2));
    for (const sx of [-1, 1]) {
        blob('#2a201a', () => ctx.ellipse(sx * 15, -114, 4.4, happy ? 3.4 : 4.8, 0, 0, Math.PI * 2));
        blob(B.hair, () => {
            /* Wide apart either way. Brows that nearly meet read as one V
               across the middle of his face, which is a scowl whichever way
               up the two halves of it are. */
            if (happy) {
                ctx.moveTo(sx * 12, -129); ctx.quadraticCurveTo(sx * 22, -137, sx * 32, -131);
                ctx.quadraticCurveTo(sx * 22, -132, sx * 12, -125);
            } else {
                ctx.moveTo(sx * 12, -133); ctx.quadraticCurveTo(sx * 22, -126, sx * 32, -118);
                ctx.quadraticCurveTo(sx * 22, -122, sx * 12, -128);

    blob(SKIN_D, () => ctx.ellipse(0, -100, 8, 7, 0, 0, Math.PI * 2));
    // the mouth first, because whatever is on his lip sits over the top of it
    if (happy) {
        blob('#7a3628', () => ctx.ellipse(0, -74, 18, 13, 0, 0, Math.PI * 2));
        ctx.save();
        ctx.beginPath(); ctx.ellipse(0, -74, 18, 13, 0, 0, Math.PI * 2); ctx.clip();
        blob('#fdf7e8', () => { ctx.rect(-18, -88, 36, 12); });
        blob('#d4667c', () => ctx.ellipse(0, -66, 10, 7, 0, 0, Math.PI * 2));
        ctx.restore();
    } else {
        blob('#8a4436', () => {
            ctx.moveTo(-15, -68); ctx.quadraticCurveTo(0, -80, 15, -68);
            ctx.quadraticCurveTo(0, -74, -15, -68);
        });
    }
    if (B.face === 'beard') blob(B.hair, () => {
        ctx.moveTo(-24, -86); ctx.quadraticCurveTo(-20, -52, 0, -50);
        ctx.quadraticCurveTo(20, -52, 24, -86);
        ctx.quadraticCurveTo(0, -74, -24, -86);
    });
    if (B.face !== 'none') blob(B.hair, () => {
        ctx.moveTo(0, -94);
        ctx.quadraticCurveTo(-17, -100, -32, -88 + droop * 7);
        ctx.quadraticCurveTo(-21, -78 + droop * 8, 0, -84);
        ctx.quadraticCurveTo(21, -78 + droop * 8, 32, -88 + droop * 7);
        ctx.quadraticCurveTo(17, -100, 0, -94);
    });
    // and a hat, which is most of who he is
    if (B.hat === 'boater') {
        blob('#e0c47f', () => { ctx.ellipse(0, -146, 62, 12, 0, 0, Math.PI * 2); });
        blob('#f0dca6', () => {
            ctx.moveTo(-37, -148); ctx.quadraticCurveTo(-38, -178, 0, -178);
            ctx.quadraticCurveTo(38, -178, 37, -148);
        });
        blob(B.apron, () => {
            ctx.moveTo(-37.5, -149); ctx.quadraticCurveTo(0, -142, 37.5, -149);
            ctx.lineTo(37.5, -160); ctx.quadraticCurveTo(0, -153, -37.5, -160);
        });
    } else if (B.hat === 'cap') {
        blob('#6e6656', () => {
            ctx.moveTo(-46, -142); ctx.quadraticCurveTo(-48, -176, 2, -174);
            ctx.quadraticCurveTo(44, -172, 42, -144);
            ctx.quadraticCurveTo(0, -136, -46, -142);
        });
        blob('#5a5344', () => {
            ctx.moveTo(-46, -142); ctx.quadraticCurveTo(-8, -134, 34, -140);
            ctx.quadraticCurveTo(48, -140, 52, -148);
            ctx.quadraticCurveTo(8, -152, -44, -147);
        });
    } else {
        blob('#fdfaf2', () => {
            ctx.moveTo(-40, -144); ctx.quadraticCurveTo(-42, -182, 0, -180);
            ctx.quadraticCurveTo(42, -178, 40, -144);
            ctx.quadraticCurveTo(0, -138, -40, -144);
        });
        blob('#e6e0d2', () => {
            ctx.moveTo(-44, -145); ctx.quadraticCurveTo(0, -136, 44, -145);
            ctx.lineTo(44, -152); ctx.quadraticCurveTo(0, -144, -44, -152);
        });
    }
    ctx.restore();
}

/* ---- showing you how ----------------------------------------------------
   Nobody reads an instruction. So on Monday, while the count is running and
   there is nothing else to do with the screen, a ghost knife walks the cut
   you are meant to make: square across the middle twist, in one stroke, over
   and over until the dog is let off. It stops the moment the round is live,
   because by then you either have it or you have not. */
const DEMO_CYCLE = 1600, DEMO_SWEEP = .5;
const demoOn = () => live && !armed && round === 1 && string && !swipe;
function drawDemo(ms) {
    const k = (string.n - 1) >> 1;                     // a twist near the middle
    const [cx, cy, tx, ty] = at(string.twists[k]);
    const nx = -ty, ny = tx, L = 78;                   // square across the string
    const ax = cx - nx * L, ay = cy - ny * L;
    const bx = cx + nx * L, by = cy + ny * L;
    const e = ((ms - roundT0) % DEMO_CYCLE) / DEMO_CYCLE;
    const p = Math.min(1, e / DEMO_SWEEP);
    const ease = p * p * (3 - 2 * p);
    const hx = ax + (bx - ax) * ease, hy = ay + (by - ay) * ease;
    const fade = p < 1 ? 1 : Math.max(0, 1 - (e - DEMO_SWEEP) / .28);
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = .5;                              // the line it wants, held
    ctx.setLineDash([7, 8]);
    ctx.strokeStyle = '#ffeab0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
    if (p > .02) {                                      // and the bit it has done
        ctx.globalAlpha = .9 * fade;
        ctx.strokeStyle = 'rgba(255,234,176,.3)'; ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.strokeStyle = '#fff6dd'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(hx, hy); ctx.stroke();
    }
    if (p < 1) {
        ctx.globalAlpha = .62;
        drawKnife(ctx, hx, hy, Math.atan2(by - ay, bx - ax), .78, cast.knife);
    }
    ctx.restore();
}

function draw() {
    const ms = now();
    ctx.clearRect(0, 0, W, H);
    if (!string) return;

    drawRail();
    // nothing hangs off it on the title page: the shopfront is the picture
    // there, and a string of sausages through the middle of the title is not
    if (!showingIntro) {
    const head = pieces.find(p => p.from === 0);
    if (head) drawHook(at(0)[0] - 7, at(0)[1]);

    for (const p of pieces) drawPiece(p);
    drawLoose(ms);

    // where you cut, flashing white for a moment
    for (let i = cutFx.length - 1; i >= 0; i--) {
        const f = cutFx[i], e = (ms - f.t0) / 340;
        if (e >= 1) { cutFx.splice(i, 1); continue; }
        const [x, y, tx, ty] = at(string.twists[f.k]);
        ctx.save();
        ctx.globalAlpha = 1 - e;
        ctx.strokeStyle = '#ffeab0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        const L = 26 + e * 26;
        ctx.beginPath();
        ctx.moveTo(x - ty * L, y + tx * L); ctx.lineTo(x + ty * L, y - tx * L);
        ctx.stroke();
        ctx.restore();
    }
    // and where you should not have
    for (let i = mess.length - 1; i >= 0; i--) {
        const m = mess[i], e = (ms - m.t0) / 700;
        if (e >= 1) { mess.splice(i, 1); continue; }
        ctx.save();
        ctx.globalAlpha = (1 - e) * .8;
        ctx.fillStyle = '#8c2b1b';
        for (let j = 0; j < 6; j++) {
            const a = j / 6 * Math.PI * 2 + m.t0;
            ctx.beginPath();
            ctx.arc(m.x + Math.cos(a) * e * 30, m.y + Math.sin(a) * e * 30 + e * e * 40,
                    4 * (1 - e), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    // the blade you just drew, and the one you are drawing
    const line = swipe || (blade && (ms - blade.t0 < 220) ? blade.pts : null);
    if (line && line.length > 1) {
        ctx.save();
        ctx.globalAlpha = swipe ? .9 : 1 - (ms - blade.t0) / 220;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath();
        line.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
        ctx.strokeStyle = 'rgba(255,234,176,.28)'; ctx.lineWidth = 7; ctx.stroke();
        ctx.strokeStyle = '#fff6dd'; ctx.lineWidth = 2.2; ctx.stroke();
        ctx.restore();
    }

    // the one it has got, on its way in: it leaves the string as the jaw opens
    // and is gone by the time the jaw shuts, which is the whole point of the
    // gape happening first
    if (chewing) {
        const e = (ms - chewing.t0) / (CHOMP * 1000);
        if (e >= .34) chewing = null;
        else if (e > .05) {
            const f = clamp((e - .05) / .29, 0, 1), ease = f * f;
            const [dx, dy] = at(clamp(dog.s, 0, string.len));
            const x = chewing.x + (dx - chewing.x) * ease;
            const y = chewing.y + (dy + 14 - chewing.y) * ease;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(chewing.ang + f * 1.1);
            ctx.scale(1 - f * .55, 1 - f * .35);
            ctx.beginPath();
            ctx.ellipse(0, 0, chewing.len, FAT * .92, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#c4472e'; ctx.fill();
            ctx.save(); ctx.clip();
            ctx.beginPath();
            ctx.ellipse(0, FAT * .6, chewing.len, FAT * .7, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8c2b1b'; ctx.fill();
            ctx.beginPath();
            ctx.ellipse(-chewing.len * .12, -FAT * .34, chewing.len * .6, FAT * .18, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#dd6f4c'; ctx.fill();
            ctx.restore();
            ctx.restore();
        }
    }

    if (demoOn()) drawDemo(ms);

    // what that swipe was worth, said out loud
    for (let i = shouts.length - 1; i >= 0; i--) {
        const sh = shouts[i], e = (now() - sh.t0) / 980;
        if (e >= 1) { shouts.splice(i, 1); continue; }
        const rise = 1 - Math.pow(1 - Math.min(1, e * 2.2), 3);
        const pop = e < .16 ? .6 + .4 * (e / .16) * (2 - e / .16) : 1;
        ctx.save();
        ctx.globalAlpha = e > .6 ? 1 - (e - .6) / .4 : 1;
        ctx.translate(clamp(sh.x, 76, W - 76), sh.y - 34 * rise);
        ctx.scale(pop, pop);
        ctx.font = (sh.small ? '700 19px' : '700 27px') + ' "Alfa Slab One", Georgia, serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(12,32,24,.92)'; ctx.lineWidth = sh.small ? 5 : 7;
        ctx.strokeText(sh.text, 0, 0);
        ctx.fillStyle = sh.bad ? '#d8462f' : sh.small ? '#bdf0cc' : '#f0d484';
        ctx.fillText(sh.text, 0, 0);
        ctx.restore();
    }

    if (dog.going || dog.s <= string.len + 80) {
        const s = clamp(dog.s, 0, string.len);
        const [x, y] = at(s);
        const below = dog.s > string.len;
        const pose = dog.chomp > 0 ? chompPose(1 - dog.chomp / CHOMP)
                                   : { open: 0, reach: 0, tilt: 0, squash: 0 };
        drawDog(ctx, x, below ? at(string.len)[1] + (dog.s - string.len) : y, 1.02,
                pose, ms, breedFor());
    }

    }

    if (!showingIntro) drawKnife(ctx, knife.x, knife.y, knife.ang, .86 + knife.at * .16, cast.knife);
}
function tick() {
    cancelAnimationFrame(raf);
    const step = () => {
        const ms = now();
        const dt = Math.min(.05, (ms - (lastMs || ms)) / 1000);
        lastMs = ms;
        dogStep(dt);
        knifeStep(dt);
        draw();
        const resting = Math.abs(knife.x - restPose()[0]) < 1.5 && knife.at < .02;
        if (live || loose.length || cutFx.length || mess.length || shouts.length
            || chewing || demoOn() || !resting) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
}
function jolt() {
    const app = document.getElementById('app');
    app.classList.remove('shake');
    void app.offsetWidth;
    app.classList.add('shake');
}

/* A new week: a new man behind the counter, a new knife on the block and six
   new dogs to get past. */
/* A new week is dealt on the shopfront rather than behind your back: the
   till is emptied, a new man is behind the counter with a new knife, and a
   new dog is at the door. You get to see who all three are before you open
   up, which is the only reason to have a shopfront at all. */
function showShop() {
    money = 0; ledger = []; fed = 0;
    round = 0; live = false; armed = false; tallying = false;
    dog.going = false; dog.chomp = 0;
    clearTimeout(tallyT); clearTimeout(settleT);
    countT.forEach(clearTimeout); countT = [];
    tallyEl.classList.remove('on');
    card.hidden = true; card.className = '';
    deal();
    drawShopfront();
    showingIntro = true;
    document.getElementById('intro').hidden = false;
    document.body.classList.add('waiting');
    draw();
}
document.getElementById('again').addEventListener('click', e => {
    e.stopPropagation();
    showShop();
});
document.getElementById('play').addEventListener('click', e => {
    e.stopPropagation();
    startSession(); audioNow();
    showingIntro = false;
    document.getElementById('intro').hidden = true;
    document.body.classList.remove('waiting');
    startRound(1);            // which sets the HUD, once there is a day to put in it
});

/* Who you are this week, what you are cutting with, and the six of them
   lined up in the order they will turn up. The dogs getting bigger left to
   right is the whole difficulty curve, said without a word. */
/* The sign over the door. Signwritten gold on a dark board with a gold rule
   inside the edge, hung off two brackets - the same thing the plates in the
   HUD are, at the size a shop would paint it. The name is squeezed to fit
   rather than wrapped, because a fascia board has one line and that is that. */
function drawFascia(g, name) {
    const x0 = 16, x1 = 324, y0 = 14, y1 = 62;
    g.save();
    for (const bx of [58, 282]) {                     // the brackets it hangs off
        g.fillStyle = '#8a6417';
        g.beginPath(); g.roundRect(bx - 4, 2, 8, 16, 3); g.fill();
    }
    g.fillStyle = '#123327';
    g.beginPath(); g.roundRect(x0, y0, x1 - x0, y1 - y0, 3); g.fill();
    g.strokeStyle = '#a87c22'; g.lineWidth = 2.5;
    g.beginPath(); g.roundRect(x0 + 1, y0 + 1, x1 - x0 - 2, y1 - y0 - 2, 3); g.stroke();
    g.strokeStyle = 'rgba(220,171,62,.5)'; g.lineWidth = 1;
    g.beginPath(); g.roundRect(x0 + 6, y0 + 6, x1 - x0 - 12, y1 - y0 - 12, 2); g.stroke();
    g.font = '400 27px "Alfa Slab One", Georgia, serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const room = x1 - x0 - 34, w = g.measureText(name).width;
    g.save();
    g.translate((x0 + x1) / 2, (y0 + y1) / 2 + 1);
    if (w > room) g.scale(room / w, 1);
    g.fillStyle = '#dcab3e';
    g.fillText(name, 0, 0);
    g.restore();
    g.restore();
}
function drawShopfront() {
    const c = document.getElementById('shopfront'), g = c.getContext('2d');
    g.clearRect(0, 0, 340, 268);
    drawFascia(g, cast.butcher.shop);
    drawButcher(g, true, { cx: 122, cy: 192, k: .68, holds: 'knife' });
    drawDog(g, 258, 208, .80 / cast.dog.k, { open: 0 }, 0, cast.dog);
    // the knife is in his hand and the dog is stood next to him, so the line
    // only has to introduce the two of them
    document.getElementById('cast-line').innerHTML =
        `${cast.butcher.name} and ${cast.dog.dog} the ${cast.dog.name}`;
}
deal();
drawShopfront();
fit();
makeString(1);
dog.s = string.len + 64;          // waiting at the bottom of the title page
draw();
</script>
